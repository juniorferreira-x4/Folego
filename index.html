function secCalendario(M){
  if(semBase()&&!lanc.length)return secW('calendario',secH('calendario','Calendário dos próximos 3 meses','Aparece quando eu tiver seus dados.')+guiaTopo());
  const t=M.t,ser=M.P.series.base,sel=diaSel(M);
  const mes=m=>{
    const first=new Date(t.getFullYear(),t.getMonth()+m,1,12),nd=dim(first.getFullYear(),first.getMonth());
    const dias=[];let min=Infinity;
    for(let day=1;day<=nd;day++){
      const dt=new Date(first.getFullYear(),first.getMonth(),day,12),i=Math.round((dt.getTime()-t.getTime())/86400000);
      const di=iso(dt),rt=realDoDia(di).map(tipoReal);
      if(i<0){dias.push({day,i,dt,past:true,v:saldoFimDia(M,di),n:rt.length,ts:rt});continue;}
      if(i>=ser.length){dias.push({day,out:true});continue;}
      const v=ser[i];min=Math.min(min,v);
      const ts=M.P.days[i].ev.filter(e=>!e.virtual).map(tipoEv).concat(i===0?rt:[]);
      dias.push({day,i,v,dt,c:v<0?'neg':(v<M.piso?'low':'ok'),n:ts.length,ts});
    }
    return {first,dias,min,nome:MESES[first.getMonth()]+' '+first.getFullYear()};
  };
  const m0=mes(0);
  let cells='';for(let z=0;z<m0.first.getDay();z++)cells+='<div class="cal-c off"></div>';
  m0.dias.forEach(d=>{
    if(d.out){cells+=`<div class="cal-c off"><span class="cal-d">${d.day}</span></div>`;return;}

function destinoReal(t){
  const cur=mkey(t);

  const cont={};
  lanc.forEach(l=>{if(l.tipo==='saida'&&l.data){const m=l.data.slice(0,7);cont[m]=(cont[m]||0)+1;}});
  let jan=prev.filter(m=>(cont[m]||0)>=8);
  if(!jan.length&&(cont[cur]||0)>=8)jan=[cur];
  if(!jan.length)return null;
  const inJ=l=>l.data&&jan.indexOf(l.data.slice(0,7))>=0;
  const renda=sum(lanc.filter(l=>l.tipo==='entrada'&&inJ(l)&&l.categoria!=='reserva'&&l.categoria!=='investimento'),'valor')/jan.length;
  const ids={};let tot=0;
  GRP_DEST.forEach(g=>{ids[g.id]=0;});
  const fx=(S.fixas||[]).map(x=>tokensOf(x.nome||'')).filter(a=>a.length);
  lanc.forEach(l=>{
    if(l.tipo!=='saida'||!inJ(l))return;
    let gid=null;
    const g=GRP_DEST.find(g=>g.cats.indexOf(l.categoria)>=0);
    if(g)gid=g.id;
    else{
      const dn=normT(l.desc||'');
      if(/CARTAO DE CREDITO|FATURA/.test(dn))gid='div';
      else if(fx.some(a=>a.some(tk=>dn.indexOf(tk)>=0)))gid='fixas';

  });
  return {jan,renda,ids,tot};
}

let pdfP=null;
function loadScript(src){
  return new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('script '+src));
    (document.head||document.documentElement).appendChild(s);
  });
}
function loadPdfJs(){
  if(!pdfP){
    const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfP=loadScript(base+'pdf.min.js').then(()=>loadScript(base+'pdf.worker.min.js')).then(()=>{
      if(!window.pdfjsWorker&&window.WorkerMessageHandler)window.pdfjsWorker={WorkerMessageHandler:window.WorkerMessageHandler};
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
      return window.pdfjsLib;
    }).catch(e=>{pdfP=null;throw e;});
  }
  return pdfP;
}
async function pdfToLines(buf,pass){
  const lib=await loadPdfJs();
  const task=lib.getDocument({data:new Uint8Array(buf),password:pass||undefined,isEvalSupported:false,useSystemFonts:true,disableFontFace:true});
  const pdf=await task.promise;
  const out=[];let chars=0;
  for(let p=1;p<=pdf.numPages&&p<=60;p++){
    const pg=await pdf.getPage(p);const tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()!=='').map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.abs(i.transform[3])||i.height||8}));
    chars+=its.reduce((n,i)=>n+i.s.length,0);
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];let cur=null;
    for(const it of its){
      if(cur&&Math.abs(it.y-cur.y)<=Math.max(2,it.h*0.45))cur.items.push(it);
      else{cur={y:it.y,items:[it]};lines.push(cur);}
    }
    for(const L of lines){
      L.items.sort((a,b)=>a.x-b.x);
      let s='',end=null;
      for(const it of L.items){
        if(end!=null){const gap=it.x-end;s+=gap>it.h*1.2?'  ':(gap>it.h*0.15?' ':'');}
        s+=it.s;end=it.x+it.w;
      }
      out.push(s.trim());
    }
  }
  try{task.destroy();}catch(e){}
  return {lines:out,chars,pages:pdf.numPages};
}

function impPrep(f){

    f.inv=f.alvo==='cartao'&&f.kind!=='pdf'&&n>0&&ent/n>=.7;
  }
  prepararArquivo(f,S,lanc);
  const av=[];
  const g=f.rows.filter(r=>r.sinal==='guess').length;
  if(g)av.push({t:'warn',x:g+(g===1?' linha sem sinal claro no arquivo.':' linhas sem sinal claro no arquivo.')+' Confira se cada uma é entrada ou saída e use "Trocar entrada/saída" quando precisar.'});
  const lim=iso(addDays(todayD(),2));
  const fut=f.rows.filter(r=>r.data>lim).length;
  if(fut)av.push({t:'warn',x:fut+(fut===1?' lançamento tem data futura.':' lançamentos têm data futura.')+' Em PDFs sem ano na data, o ano é estimado. Confira.'});
  if(f.total>f.raw.length)av.push({t:'warn',x:'O arquivo tem '+f.total+' linhas. Li as primeiras '+f.raw.length+'. Importe o restante em outro arquivo.'});

  if(f.alvo==='cartao'&&!S.cartoes.length)av.push({t:'crit',x:'Cadastre o cartão em Lançamentos para importar esta fatura.',go:'cadastro'});

async function lerUm(file,pass){
  const imp=ui.imp;
  try{
    const buf=await file.arrayBuffer();
    const h=new Uint8Array(buf.slice(0,5));
    const isPdf=h[0]===0x25&&h[1]===0x50&&h[2]===0x44&&h[3]===0x46;
    let res,kind;
    if(isPdf){
      let pl;
      try{pl=await pdfToLines(buf,pass);}
      catch(e){
        if(e&&e.name==='PasswordException'){imp.pass={file,name:file.name,errada:e.code===2};return;}
        imp.msg={t:'crit',x:'Não consegui abrir "'+file.name+'". Se o arquivo está íntegro, o leitor de PDF pode estar bloqueado nesta rede. Tente baixar o extrato em OFX ou CSV.'};return;
      }
      if(pl.chars<20){imp.msg={t:'warn',x:'"'+file.name+'" parece ser um PDF escaneado, só com imagem. Não consigo ler sem reconhecimento de texto. Baixe o extrato em OFX ou CSV no app do banco.'};return;}
      const joined=pl.lines.join('\n'),jn=normT(joined);
      const cartao=(/FATURA/.test(jn)&&/(VENCIMENTO|LIMITE)/.test(jn))||/fatura|cartao|card/i.test(file.name);
      res=parseLines(pl.lines,{cartao,hoje:new Date()});res.cartao=cartao;res.dono=nomeDono(pl.lines);res.texto=joined.slice(0,600);kind='pdf';
    }else{
      const text=decodeBuf(buf);
      if(/OFXHEADER|<OFX>/i.test(text.slice(0,4000))){res=parseOFX(text);kind='ofx';}
      else{res=parseCSV(text);kind='csv';res.texto=text.slice(0,800);res.cartao=/fatura|cartao|card|invoice/i.test(file.name);}
    }
    if(!res.rows.length&&res.saldo!=null){imp.msg={t:'acc',x:'"'+file.name+'" não tem lançamentos no período'+(res.periodo?' ('+fISO(res.periodo[0])+' a '+fISO(res.periodo[1])+')':'')+'. O saldo informado nele é '+brl(res.saldo)+'. Se esse for o saldo da conta hoje, some com o das outras contas.'};return;}
    if(!res.rows.length){imp.msg={t:'warn',x:'Não encontrei lançamentos em "'+file.name+'". Confira se é um extrato ou uma fatura. Em PDF, a leitura depende do layout do banco. Se puder, baixe em OFX ou CSV.'};return;}
    const base=file.name+' '+(res.org||'');
    const f={id:uid(),name:file.name,kind,alvo:res.cartao?'cartao':'conta',
      banco:palpiteBanco(base,S.bancos)||palpiteBanco(res.texto||'',S.bancos)||(/COD\. LANC\./i.test(res.texto||'')&&S.bancos.indexOf('Bradesco')>=0?'Bradesco':''),
      cartaoId:palpiteCartao(base+' '+(res.texto||''),S.cartoes),
      dono:res.dono||null,donos:[],raw:res.rows.slice(0,IMP_MAX),total:res.rows.length,inv:false,invManual:false,
      meta:{saldo:res.saldo,saldoData:res.saldoData,periodo:res.periodo},avisos:[],all:false,fatura:false};
    imp.files.push(f);
    imp.last=null;
  }catch(e){
    imp.msg={t:'crit',x:'Não consegui ler "'+file.name+'". Tente outro formato (OFX ou CSV).'};
  }
}

function impEfeito(){
  let n=0,ent=0,sai=0,d=0;
  for(const f of ui.imp.files)for(const r of f.rows||[]){
    if(!r.inc||r.alvo==='skip')continue;
    n++;if(r.tipo==='entrada')ent+=r.valor;else sai+=r.valor;
    if(f.alvo==='conta'&&tsOf(r.data)>S.cfg.saldoTs)d+=r.tipo==='entrada'?r.valor:-r.valor;
  }
  return {n,ent,sai,d};
}
function impFatura(f){
  let t=0;for(const r of f.rows){if(!r.inc||r.alvo==='skip')continue;t+=r.tipo==='saida'?r.valor:-r.valor;}
  return round2(Math.max(0,t));
}

async function importar(){
  const imp=ui.imp;
  if(imp.go)return;
  const ef=impEfeito();
  if(!ef.n){toast('Nenhuma linha selecionada.');return;}
  const sv=document.getElementById('imp-saldo');
  let novoSaldo=null;
  if(sv&&sv.value.trim()!==''){const v=num(sv.value);if(!isFinite(v)){toast('Saldo inválido. Use números, como 1500,00.');return;}novoSaldo=v;}
  imp.go=true;ui.saving++;setStatus();render();
  const used=new Set(lanc.filter(l=>l.refId&&l.comp).map(l=>l.refId+'|'+l.comp));
  const aprender={};let gravados=0,ignoradas=0,erro=false;const nomes=[];
  const antes=saldoAtual(S,lanc);
  const restantes=[];
  try{
    for(const f of imp.files){
      if(f.alvo==='cartao'&&!S.cartoes.some(c=>c.id===f.cartaoId)){restantes.push(f);continue;}
      const itens=[];
      f.rows.forEach(r=>{
        if(!r.inc||r.alvo==='skip'){ignoradas++;return;}
        const fx=Object.assign({},resolverAlvo(r.alvo,r,S));
        if(fx.refId){const k=fx.refId+'|'+fx.comp;if(used.has(k)){delete fx.refId;delete fx.comp;}else used.add(k);}
        const it={k:uid().slice(0,6),ts:tsOf(r.data),data:r.data,tipo:r.tipo,valor:round2(r.valor),categoria:fx.categoria,desc:String(r.desc).slice(0,90),ext:r.ext};
        if(fx.refId){it.refId=fx.refId;it.comp=fx.comp;}
        if(f.alvo==='cartao')it.cartaoId=f.cartaoId;else if(f.banco)it.banco=f.banco;
        itens.push(it);
        if(r.alvo!==r.auto){const key=merchKey(r.desc);if(key)aprender[key]=r.alvo;}
      });
      const salvos=new Set();
      try{
        for(let i=0;i<itens.length;i+=400){
          const part=itens.slice(i,i+400);
          const doc={ts:Date.now()+i,arq:f.name.slice(0,60),tipo:f.alvo,banco:f.alvo==='conta'?(f.banco||null):null,cartaoId:f.alvo==='cartao'?f.cartaoId:null,
            de:part.reduce((m,x)=>x.data<m?x.data:m,'9999-99-99'),ate:part.reduce((m,x)=>x.data>m?x.data:m,'0000-00-00'),itens:part};
          if(lotesCol)await lotesCol.add(doc);
          else{loteRaw=[Object.assign({id:'L'+uid()},doc)].concat(loteRaw);rebuild();}
          part.forEach(x=>salvos.add(x.ext));gravados+=part.length;
        }
        if(f.alvo==='cartao'&&f.fatura){const c=S.cartoes.find(z=>z.id===f.cartaoId);const t=impFatura(f);if(c&&t>0)c.fatura=t;}
        nomes.push(f.name);
      }catch(e){
        erro=true;
        f.rows.forEach(r=>{if(salvos.has(r.ext)){r.dup='ext';r.inc=false;}});
        restantes.push(f);
      }
    }
  }finally{
    ui.saving--;imp.go=false;
  }
  if(Object.keys(aprender).length){
    S.regras=Object.assign({},S.regras,aprender);
    const ks=Object.keys(S.regras);if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>delete S.regras[k]);
  }
  if(gravados>0&&imp.donos&&imp.donos.length)S.cfg.meusNomes=Array.from(new Set(((S.cfg&&S.cfg.meusNomes)||[]).concat(imp.donos)));
  if(novoSaldo!=null&&gravados>0){S.cfg.saldo=novoSaldo;S.cfg.saldoTs=Date.now();S.cfg.saldoInformado=true;}
  if(gravados>0)persist();
  imp.files=restantes;
  if(gravados>0)imp.last={n:gravados,arqs:nomes,antes,depois:novoSaldo!=null?novoSaldo:antes+ef.d,corrigido:novoSaldo!=null,aprendeu:Object.keys(aprender).length};
  if(erro)imp.msg={t:'crit',x:'Algum arquivo não foi salvo por completo. Os que falharam continuam na tela. Tente importar de novo.'};
  setStatus();impAll();render();
}

    case 'imp-inv':if(f){f.inv=!f.inv;f.invManual=true;impPrep(f);parearTransferencias(imp.files);render();}break;
    case 'imp-all':if(f){f.all=!f.all;render();}break;

    case 'imp-go':importar();break;

  }

function histMeses(lotes){
  const meses={};
  lotes.forEach(L=>{(L.itens||[]).forEach(it=>{
    if(!it.data)return;const m=it.data.slice(0,7);
    const g=meses[m]||(meses[m]={n:0,e:0,s:0,arq:{}});
    g.n++;if(it.tipo==='entrada')g.e+=it.valor;else if(!it.cartaoId)g.s+=it.valor;
    const a=g.arq[L.id]||(g.arq[L.id]={L,n:0});a.n++;
  });});
  const todos=Object.keys(meses).sort().reverse();
  const anos=[...new Set(todos.map(m=>m.slice(0,4)))];
  const ano=anos.indexOf(ui.impAno)>=0||ui.impAno==='todos'?ui.impAno:anos[0];
  const doAno=todos.filter(m=>ano==='todos'||m.startsWith(ano));
  const mes=doAno.indexOf(ui.impMes)>=0?ui.impMes:'';
  const ks=mes?[mes]:doAno;
  const tot=ks.reduce((o,m)=>{o.n+=meses[m].n;o.e+=meses[m].e;o.s+=meses[m].s;return o;},{n:0,e:0,s:0});
  const filtro=`<div class="fields imp-filtro"><div><label for="imp-ano">Ano</label><select id="imp-ano">${anos.map(a=>`<option value="${a}" ${a===ano?'selected':''}>${a}</option>`).join('')}<option value="todos" ${ano==='todos'?'selected':''}>Todos os anos</option></select></div><div><label for="imp-mes">Mês</label><select id="imp-mes"><option value="">Todos os meses</option>${doAno.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${MESES[+m.slice(5)-1]}${ano==='todos'?' '+m.slice(0,4):''}</option>`).join('')}</select></div><div class="imp-tot"><span class="small muted">${mes?'No mês':'No período'}</span><b class="mono">${tot.n} lanç. · <span class="in">+${brl0(tot.e)}</span> · −${brl0(tot.s)}</b></div></div>`;
  const onde=L=>L.tipo==='cartao'?'cartão '+esc((S.cartoes.find(c=>c.id===L.cartaoId)||{nome:''}).nome):('conta'+(L.banco?' '+esc(L.banco):''));
  const blocos=ks.map((m,i)=>{
    const g=meses[m],nome=MESES[+m.slice(5)-1]+' '+m.slice(0,4);
    const arqs=Object.values(g.arq).sort((a,b)=>b.n-a.n).map(({L,n})=>{
      const arm=ui.delArm==='L:'+L.id;
      return `<div class="item"><div class="main"><div>${esc(L.arq||'Importação')}</div><div class="small muted">${n} ${n===1?'lançamento':'lançamentos'} neste mês · ${onde(L)} · importado em ${fISO(iso(new Date(L.ts)))}</div>${arm?`<div class="small" style="margin-top:4px">Desfazer tira o arquivo inteiro, de ${L.de?fISO(L.de)+' a '+fISO(L.ate):'todos os meses'}.</div>`:''}</div>${arm?`<div class="row"><button class="btn small danger" data-act="imp-undo" data-id="${esc(L.id)}">Desfazer arquivo</button><button class="btn small ghost" data-act="del-cancel">Voltar</button></div>`:`<button class="btn small ghost" data-act="imp-undo-arm" data-id="${esc(L.id)}">Desfazer</button>`}</div>`;
    }).join('');
    return `<details class="mes"${i===0||mes?' open':''}><summary><span class="mes-t">${nome}</span><span class="mes-n">${g.n} lanç. · <span class="in">+${brl0(g.e)}</span> · −${brl0(g.s)}</span></summary><div class="list">${arqs}</div></details>`;
  }).join('');
  return `<section class="card"><div class="row between"><h3>Importações anteriores</h3><span class="small muted">${lotes.length} ${lotes.length===1?'arquivo':'arquivos'}, todos somados na análise</span></div>${filtro}<div style="margin-top:6px">${blocos||'<p class="small muted">Nada importado neste período.</p>'}</div></section>`;
}

function render(fresh){

  root.querySelectorAll('input[id],select[id]').forEach(el=>{if(el.value!==el.defaultValue)saved[el.id]=el.value;});

  root.innerHTML=html();
  root.querySelectorAll('input[id],select[id]').forEach(el=>{
    if(el.id in saved&&!fresh.some(p=>el.id.indexOf(p)===0))el.value=saved[el.id];

}

function sbDb(uid){

      const q={docs:r.data.map(x=>({id:x.id,data:()=>x.data}))};L[c].forEach(f=>f.ok(q));}
    catch(e){L[c].forEach(f=>f.err&&f.err(e));}
  };
  const emitApp=async()=>{try{const d=await fetchApp();L.app.forEach(f=>f.ok(snapApp(d)));}catch(e){}};
  const col=c=>({

  });
  window.addEventListener('focus',()=>{if(ui.saving>0)return;emitApp();emitCol('lancamentos');emitCol('lotes');});

    collection:col

}

  render();
  let id=null;
  if(/type=recovery/.test(location.hash)){return;}
  try{const r=await sb.auth.getSession();const s=r.data&&r.data.session;id=s?s.user.id:null;ui.email=s?s.user.email:'';}catch(e){id=null;}
  if(!id){mostrarLogin('entrar');return;}
  appRef=sbDb(id);
  lancCol=appRef.collection('lancamentos');
  lotesCol=appRef.collection('lotes');
  try{
    const first=await appRef.get();
    if(first.exists){S=clone(first.data());}
    else{S=seed();await appRef.set(clone(S));}   // cria o documento uma única vez, com leitura definitiva do servidor
  }catch(e){ui.modo='local';appRef=null;lancCol=null;lotesCol=null;S=seed();toast('Não consegui abrir seus dados. Nada será salvo nesta visita.');render();return;}
  normalize(S);
  ui.modo='nuvem';render();
  appRef.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites||ui.saving>0||!snap.exists)return;
    const d=normalize(clone(snap.data()));
    if(JSON.stringify(d)===JSON.stringify(S))return;
    S=d;render();
  },()=>{});
  lancCol.orderBy('ts','desc').limit(1000).onSnapshot(q=>{
    lancRaw=q.docs.map(d=>Object.assign({id:d.id},d.data()));rebuild();render();
  },()=>{toast('A lista de lançamentos parou de atualizar. Recarregue a página.');});
  lotesCol.orderBy('ts','desc').limit(200).onSnapshot(q=>{
    loteRaw=q.docs.map(d=>Object.assign({id:d.id},d.data()));rebuild();render();
  },()=>{});
}
boot();
})();
</script>
</body>
</html>
