<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fôlego Financeiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel em blocos. Cartões arredondados sobre fundo cinza, números grandes no topo,
   o mês corrente grande e os próximos em miniatura. Laranja só onde há ação; verde e vermelho só para estado. */
:root{
  --bg:#E6E9ED; --surface:#FFFFFF; --surface-2:#F2F4F6; --line:#E1E5EA; --line-strong:#9AA3AF;
  --ink:#111418; --muted:#4D5560; --accent:#C2410C; --accent-hover:#9A3412; --accent-ink:#FFFFFF; --accent-soft:#FFE8DC;
  --good:#1F6B45; --good-soft:#DCEFE4; --warn:#8A4B00; --warn-soft:#FFF1E0; --crit:#B42318; --crit-soft:#FDE2DE;
  --card-line:transparent; --field-line:transparent; --hero:#111418; --hero-ink:#FFFFFF; --hero-muted:#C9CED5; --hero-crit:#FF8E80;
  --c3:#6B7280; --c4:#D97706; --c5:#C9CED5; --info:#1D4ED8;
  --s-min:#B4410C; --s-base:#C2410C; --s-max:#0F766E; --band:rgba(194,65,12,.08);
  --display:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#181B20; --surface-2:#22262D; --line:#2A2F37; --line-strong:#5F6875;
  --ink:#F1F3F5; --muted:#A9B1BC; --accent:#FF8A4C; --accent-hover:#FFA06E; --accent-ink:#1A0D05; --accent-soft:#3A2216;
  --good:#5FD39A; --good-soft:#163527; --warn:#F2C15A; --warn-soft:#3A2D12; --crit:#FF8E80; --crit-soft:#3E1D19;
  --card-line:#2A2F37; --field-line:#353B45; --hero:#F1F3F5; --hero-ink:#111418; --hero-muted:#4D5560; --hero-crit:#B42318;
  --c3:#8A93A0; --c4:#F2C15A; --c5:#4A515C; --info:#6FA8FF;
  --s-min:#FF9A6B; --s-base:#FF8A4C; --s-max:#5FD3C8; --band:rgba(255,138,76,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#181B20; --surface-2:#22262D; --line:#2A2F37; --line-strong:#5F6875;
  --ink:#F1F3F5; --muted:#A9B1BC; --accent:#FF8A4C; --accent-hover:#FFA06E; --accent-ink:#1A0D05; --accent-soft:#3A2216;
  --good:#5FD39A; --good-soft:#163527; --warn:#F2C15A; --warn-soft:#3A2D12; --crit:#FF8E80; --crit-soft:#3E1D19;
  --card-line:#2A2F37; --field-line:#353B45; --hero:#F1F3F5; --hero-ink:#111418; --hero-muted:#4D5560; --hero-crit:#B42318;
  --c3:#8A93A0; --c4:#F2C15A; --c5:#4A515C; --info:#6FA8FF;
  --s-min:#FF9A6B; --s-base:#FF8A4C; --s-max:#5FD3C8; --band:rgba(255,138,76,.12); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 88px}
h1,h2,h3,p{margin:0}
h2{font:700 1.5rem/1.2 var(--display);letter-spacing:-.005em;text-wrap:balance}
h3{font:700 1.02rem/1.3 var(--body)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px 12px}
.brand{font:700 1.25rem/1 var(--display)}
.status{font:500 .78rem/1 var(--mono);color:var(--muted)}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:0 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs{display:flex;gap:6px;padding-block:8px;overflow-x:auto;flex:1 1 auto;min-width:0}
.kpis{display:flex;gap:20px;flex:none}
.kpi{display:flex;flex-direction:column;align-items:flex-end;gap:3px;line-height:1.1;min-width:0}
.kpi span{overflow:hidden;text-overflow:ellipsis;max-width:16rem}
.kpi b small{font:500 .74rem/1 var(--mono);color:var(--muted)}
.k-sm{display:none}
.kbar{display:block;width:100%;min-width:64px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.kbar i{display:block;height:100%;background:var(--accent)}
.kpi-form{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding-block:4px 12px}
.kpi-form > div:not(.row){flex:1 1 200px;min-width:0}
.kpi span{font:700 .72rem/1.1 var(--body);color:var(--muted);white-space:nowrap}
.kpi b{font:600 1.05rem/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b.neg{color:var(--crit)} .kpi b.muted{font:400 .85rem/1.1 var(--body)}
@media(max-width:700px){.stick{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:0}.stick > *{max-width:100%}.kpis{order:-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:8px}.kpi{align-items:flex-start}.kpi span{max-width:100%;white-space:nowrap;font-size:.66rem}.kpi b{font-size:.9rem}.kpi b small{display:block;margin-top:2px;font-size:.66rem}.k-lg{display:none}.k-sm{display:inline}}
.tab{appearance:none;border:1px solid transparent;background:none;color:var(--muted);font:700 .95rem/1 var(--body);padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.tab:hover{color:var(--ink);border-color:var(--line)} .tab[aria-current="page"]:hover{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:780px){.grid2{grid-template-columns:1.35fr 1fr}.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.card > h3 + *{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink);font:600 .82rem/1 var(--body);padding:9px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.hero{display:grid;gap:18px;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
@media(min-width:780px){.hero{grid-template-columns:1.3fr 1fr;padding:24px}}
.hero .big{font:700 clamp(2.2rem,8vw,3.6rem)/1 var(--display);letter-spacing:-.025em;margin-top:10px;text-wrap:balance}
.hero .big.crit{color:var(--crit)} .hero .big.good{color:var(--good)}
.hero .lede{margin-top:12px;max-width:52ch}
.facts{display:grid;gap:0;align-content:start}
.fact{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact b{font:500 .95rem/1.3 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:.82rem;background:var(--surface-2)}
.chip b{font-family:var(--mono);font-weight:500}

.pill{display:inline-block;font:600 .74rem/1 var(--mono);padding:5px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:8px;padding:12px 14px;font-size:.95rem;background:var(--warn-soft);color:var(--ink)}
.note.crit{background:var(--crit-soft)}
.note.good{background:var(--good-soft)}
.note.acc{background:var(--accent-soft)}

label{display:block;font:700 .85rem/1.2 var(--body);color:var(--ink);margin-bottom:6px}
input,select{width:100%;font:400 1rem/1.2 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;min-height:44px}
input::placeholder{color:var(--muted);opacity:.85}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:700 .92rem/1 var(--body);padding:11px 16px;border-radius:8px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{padding:8px 12px;min-height:36px;font-size:.85rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{color:var(--ink)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1 1 auto}
.item .main > div:first-child{overflow-wrap:anywhere}
.item .val{font:600 1rem/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.val.out{color:var(--crit)} .val.in{color:var(--good)}
.when{font:600 .8rem/1.2 var(--mono);color:var(--muted);width:3.9rem;flex:none}
.when.soon{color:var(--warn)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good > i{background:var(--good)}
.phase{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:8px}
.phase.now{border-color:var(--accent);background:var(--accent-soft)}
.phase.done{opacity:.75}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:10px}
.chartwrap{width:100%;min-width:0}
svg text{font-family:var(--mono);fill:var(--muted)}
.tbl{overflow-x:auto}
.qa-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:.95rem;font-weight:700;max-width:min(92vw,520px);z-index:20}
.cal3{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.cal3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1040px){.cal3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 6px;font:600 .68rem/1 var(--mono);color:var(--muted);text-align:center;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-c{min-height:56px;border-radius:6px;padding:5px 4px 4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;min-width:0;overflow:hidden}
.cal-c.off{background:none;border:0}
.cal-c.past{background:none;border:0;min-height:30px}
.cal-c.past .cal-d{color:var(--muted);font-weight:400}
.cal-c.ok{border-bottom-color:var(--good)} .cal-c.low{border-bottom-color:var(--warn)} .cal-c.neg{border-bottom-color:var(--crit)}
.cal-c.low .cal-v{color:var(--warn)} .cal-c.neg .cal-v{color:var(--crit)}
.cal-c.today{outline:2px solid var(--ink);outline-offset:-1px}
.cal-c.first{}
.cal-d{font:700 .74rem/1 var(--body);color:var(--ink)}
.cal-v{font:600 .66rem/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.cal-dots i.in{background:var(--good)} .cal-dots i.out{background:var(--crit)}
table.led{width:100%;min-width:560px;border-collapse:collapse;font-size:.88rem}
table.led th{font:500 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.led td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.led .r{text-align:right;white-space:nowrap}
table.led tr.est td{color:var(--muted)}
table.led td.in{color:var(--good)} table.led td.warn{color:var(--warn);font-weight:500} table.led td.crit{color:var(--crit);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media(prefers-reduced-motion:no-preference){.hero .big{transition:color .2s}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop{border:2px dashed var(--line-strong);border-radius:8px;padding:22px 16px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
label.btn{display:inline-flex;align-items:center;margin:0;color:var(--ink);font:600 .88rem/1 var(--body)}
label.btn.primary{color:var(--accent-ink)}
.sr:focus-visible + label.btn{outline:2px solid var(--accent);outline-offset:2px}
.imp-list{display:flex;flex-direction:column;margin-top:6px}
.imp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.imp-row:last-child{border-bottom:0}
.imp-row.off{opacity:.62}
.imp-chk{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.imp-desc{overflow-wrap:anywhere}
.imp-main .pill{margin:2px 2px 0 0}
.imp-val{font:500 .95rem/1.2 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.imp-val.in{color:var(--good)}
.imp-sel{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.imp-sel select{min-height:38px;padding:7px 9px;font-size:.9rem;flex:1 1 190px}
@media(min-width:780px){.imp-row{grid-template-columns:auto minmax(0,1fr) auto 250px}.imp-sel{grid-column:auto}}
.btn[disabled]{opacity:.5;cursor:default}

/* página única */
.page{display:block}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:32px 4px;scroll-margin-top:76px}
@media(max-width:700px){.sec{scroll-margin-top:124px}}
.sec:first-child{border-top:0;padding-top:4px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.6rem}
.cmp{display:grid;margin-top:10px}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr) 158px 158px;column-gap:14px;padding-block:9px;border-bottom:1px solid var(--line);align-items:start}
.cmp-r.h{font:700 .78rem/1.2 var(--body);color:var(--muted);padding-block:4px 8px;border-bottom:1px solid var(--line-strong)}
.cmp-r.h .cmp-v{align-items:flex-end;text-align:right;color:var(--ink)}
.cmp-n{font-size:.95rem}
.cmp-v{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cmp-v b{font:600 1rem/1.2 var(--mono);white-space:nowrap}
.cmp-v span{font:500 .8rem/1.2 var(--mono);color:var(--muted)}
.cmp-a{grid-column:1;margin-top:4px}
.cmp-r.tot{border-bottom:0} .cmp-r.tot .cmp-n{font-weight:700}
.vp{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pct{font:600 1rem/1 var(--mono);color:var(--accent-ink);background:var(--accent);padding:5px 9px;border-radius:999px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.pct.ind{color:var(--bg);background:var(--good)}
@media(max-width:480px){.cmp-r{grid-template-columns:minmax(0,1fr) 96px 96px;column-gap:6px}.vp{gap:4px}.pct{font-size:.8rem;padding:3px 6px}.cmp-v b{font-size:.88rem}}
.fact b.neg{color:var(--crit)} .fact b.pos{color:var(--good)}
.tabs{scrollbar-width:thin}
button.cal-c{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
button.cal-c:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal-c.sel{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-1px}
.cal-c.today.sel{outline-color:var(--accent)}
.lg{display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:4.4rem minmax(0,1fr) 5.6rem 6.2rem 6rem;gap:2px 10px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:.88rem}
.lr.h{font:600 .72rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom-color:var(--line-strong)}
.lr .r{text-align:right;white-space:nowrap}
.lr.est{color:var(--muted)}
.lr .in{color:var(--good)} .lr .warn{color:var(--warn);font-weight:500} .lr .crit{color:var(--crit);font-weight:500}
.lr-i small{display:block;color:var(--muted);font-size:.78rem}
.lr-a{text-align:right}
.lr-cf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0 12px;border-bottom:1px solid var(--line)}
@media(max-width:640px){
  .lr{grid-template-columns:3.6rem minmax(0,1fr) auto;grid-template-areas:"d i v" "d a s"}
  .lr.h{display:none}
  .lr-d{grid-area:d}.lr-i{grid-area:i}.lr-v{grid-area:v}.lr-s{grid-area:s}.lr-a{grid-area:a;text-align:left}
}
.coll{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;min-height:34px}
.coll-t{font:600 .95rem/1.3 var(--body)}
.coll-b{margin-top:12px}
.chev{font:600 1.3rem/1 var(--mono);color:var(--muted);flex:none}
.hab{padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.hab:last-of-type{border-bottom:0}
.mbars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mb{display:grid;grid-template-columns:2.4rem minmax(0,1fr) 5.4rem;gap:8px;align-items:center;font-size:.82rem}
.mb-m{color:var(--muted);font:600 .74rem/1 var(--mono);text-transform:uppercase}
.mb-v{text-align:right}

.cmp-v b.neg{color:var(--crit)}
.phase.now{border-color:var(--accent);background:var(--accent-soft)}
@media(min-width:780px){.grid2.cons{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.cmp-a{color:var(--muted)}
.lf-more{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.lf-more .btn{padding:0;min-height:0;color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;font:400 .95rem/1.3 var(--body);color:var(--ink);margin:0;cursor:pointer}

<body>

<div id="app" class="wrap"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

//#ENGINE-START
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const dueOn=(dia,d)=>d.getDate()===Math.min(dia,dim(d.getFullYear(),d.getMonth()));
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(typeof f==='function'?f(x):x[f])||0),0);
const VAR_CATS=['mercado','transporte','lazer','saúde','outros'];
const DEBT_CARA=['rotativo','cheque_especial'];
const SCN=['min','base','max'];

const jaAconteceu=l=>!l.data||l.data<=iso(todayD());
function saldoAtual(S,lanc){let s=S.cfg.saldo;for(const l of lanc){if(l.ts>S.cfg.saldoTs&&!l.cartaoId&&jaAconteceu(l))s+=l.tipo==='entrada'?l.valor:-l.valor;}return s;}
function investAtual(S,lanc){let r=S.cfg.investimento||0;for(const l of lanc){if(l.categoria==='investimento'&&l.ts>(S.cfg.investimentoTs||0)&&jaAconteceu(l))r+=l.valor;}return r;}
function reservaAtual(S,lanc){let r=S.cfg.reserva;for(const l of lanc){if(l.categoria==='reserva'&&l.ts>S.cfg.reservaTs&&jaAconteceu(l))r+=l.valor;}return r;}
function dividaSaldo(d,lanc){let s=d.saldo;for(const l of lanc){if(l.categoria==='divida'&&l.refId===d.id&&l.ts>d.ts)s-=l.valor;}return Math.max(0,s);}

function variavel(S,lanc,t){
  if(typeof S.cfg.variavelMensal==='number')return {valor:S.cfg.variavelMensal,fonte:'manual'};
  let c=new Date(S.cfg.criado);c.setHours(12,0,0,0);
  for(const l of lanc){if(l.tipo==='saida'&&!l.cartaoId&&VAR_CATS.includes(l.categoria)&&l.data){const d0=new Date(l.data+'T12:00:00');if(d0<c)c=d0;}}
  const dias=Math.floor((t.getTime()-c.getTime())/86400000)+1;
  if(dias<14)return {valor:null,fonte:'calibrando',dias};
  const isoIni=iso(addDays(t,-29));
  const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  const cad=[].concat(S.fixas||[],S.dividas||[],S.rendas||[],S.cartoes||[]).map(x=>nz(x.nome).replace(/[^A-Z\s]/g,' ').split(/\s+/).filter(w=>w.length>=4)).filter(a=>a.length);
  const win=lanc.filter(l=>l.tipo==='saida'&&!l.cartaoId&&VAR_CATS.includes(l.categoria)&&l.data>=isoIni&&!cad.some(tk=>tk.some(w=>nz(l.desc).indexOf(w)>=0)));
  const vs=win.map(l=>l.valor).sort((a,b)=>a-b),md=vs.length?vs[Math.floor(vs.length/2)]:0,cap=Math.max(400,5*md);
  let tot=0,pont=0;
  for(const l of win){if(l.valor>cap)pont+=l.valor;else tot+=l.valor;}
  return {valor:tot/Math.min(30,dias)*30,fonte:'calibrado',dias,pontual:pont};
}

function parcelasRestantes(d,lanc){
  if(!(d.vezes>0))return null;
  let pagas=0;
  for(const l of lanc){if(l.categoria==='divida_min'&&l.refId===d.id&&l.ts>d.ts)pagas++;}
  return Math.max(0,d.vezes-pagas);
}

function project(S,lanc,t,varMensal,extras){
  const H=S.cfg.horizonte,saldo=saldoAtual(S,lanc);
  const paid=new Set();
  for(const l of lanc)if(l.refId&&l.comp)paid.add(l.refId+'|'+l.comp);
  const vd=(varMensal||0)/30;
  const series={min:[],base:[],max:[]},b={min:saldo,base:saldo,max:saldo},events=[],days=[];
  const rendas=S.rendas.filter(r=>r.ativa!==false);
  const dividas=S.dividas.map(d=>({d,aberto:dividaSaldo(d,lanc)>0,rest:parcelasRestantes(d,lanc),n:0}));
  const plan=S.planejados||[];
  const hojeIso=iso(t),futuros=lanc.filter(l=>l.data&&l.data>hojeIso&&!l.cartaoId&&!l.imp&&l.ts>S.cfg.saldoTs);
  const rp=Math.max(0,(S.cfg.pagueSePct||0)/100),pctR=String(S.cfg.pagueSePct||0).replace('.',',');
  const recv={};for(const l of lanc)if(l.refId&&l.comp&&l.tipo==='entrada')recv[l.refId+'|'+l.comp]=l.valor;
  const sgn=x=>({min:x,base:x,max:x});
  for(let i=0;i<=H;i++){
    const d=addDays(t,i),mk=mkey(d),di=iso(d);
    const spread={min:-vd,base:-vd,max:-vd},ev=[];
    for(const r of rendas){
      if(r.dia==null){for(const k of SCN)spread[k]+=r[k]/30;}
      else if(dueOn(r.dia,d)&&!paid.has(r.id+'|'+mk)){
        ev.push({i,date:d,kind:'renda',id:r.id,comp:mk,nome:r.nome,tipo:r.tipo,banco:r.banco,valor:r.base,v:{min:r.min,base:r.base,max:r.max}});
      }
      if(rp>0){
        const rid='res_'+r.id;
        const mkEv=(nome,vals)=>({i,date:d,kind:'reserva',id:rid,comp:mk,nome,valor:Math.abs(vals.base),v:vals});
        if(r.dia==null){
          if(dueOn(31,d)&&!paid.has(rid+'|'+mk))ev.push(mkEv('Reserva obrigatória ('+pctR+'% de '+r.nome+' do mês)',{min:-rp*r.min,base:-rp*r.base,max:-rp*r.max}));
        }else if(dueOn(r.dia,d)&&!paid.has(rid+'|'+mk)){
          ev.push(mkEv('Reserva obrigatória ('+pctR+'% do '+r.nome+')',{min:-rp*r.min,base:-rp*r.base,max:-rp*r.max}));
        }else if(i===0&&!paid.has(rid+'|'+mk)&&recv[r.id+'|'+mk]!=null&&d.getDate()>Math.min(r.dia,dim(d.getFullYear(),d.getMonth()))){
          const x=-rp*recv[r.id+'|'+mk];
          ev.push(mkEv('Reserva obrigatória ('+pctR+'% do '+r.nome+' recebido)',{min:x,base:x,max:x}));
        }
      }
    }
    for(const f of S.fixas)if(dueOn(f.dia,d)&&!paid.has(f.id+'|'+mk)){
      ev.push({i,date:d,kind:'fixa',id:f.id,comp:mk,nome:f.nome,banco:f.banco,valor:f.valor,v:sgn(-f.valor)});
    }
    for(const c of S.cartoes)if(c.fatura>0&&dueOn(c.venc,d)&&!paid.has(c.id+'|'+mk)){
      ev.push({i,date:d,kind:'cartao',id:c.id,comp:mk,nome:'Fatura '+c.nome,banco:c.banco,valor:c.fatura,v:sgn(-c.fatura)});
    }
    for(const x of dividas){
      const m=x.d.minimo||0;if(m<=0||!x.aberto)continue;
      if(x.d.dia==null){
        if(x.rest==null||i<x.rest*30){for(const k of SCN)spread[k]-=m/30;}
      }else if(dueOn(x.d.dia,d)&&!paid.has(x.d.id+'|'+mk)&&(x.rest==null||x.n<x.rest)){
        x.n++;
        ev.push({i,date:d,kind:'divida',id:x.d.id,comp:mk,nome:(x.rest!=null?'Parcela ':'Mínimo ')+x.d.nome,banco:x.d.banco,valor:m,v:sgn(-m)});
      }
    }
    if(i===0){
      for(const p of plan)if(p.data<di&&!paid.has(p.id+'|one'))ev.push({i,date:d,kind:'plano',id:p.id,comp:'one',nome:p.nome+' (atrasado)',tipo:p.tipo,banco:p.banco,valor:p.valor,v:sgn(p.tipo==='entrada'?p.valor:-p.valor)});
    }
    if(i>0)for(const l of futuros)if(l.data===di)ev.push({i,date:d,kind:'lanc',id:l.id,comp:'lanc',nome:l.desc||'Lançamento',banco:l.banco,valor:l.valor,v:sgn(l.tipo==='entrada'?l.valor:-l.valor)});
    for(const p of plan){
      if(p.data===di&&!paid.has(p.id+'|one')){

    if(extras)for(const x of extras)if(x.i===i)ev.push({i,date:d,kind:'extra',id:'extra',comp:'x',nome:x.nome||'Compra',valor:x.valor,v:sgn(-x.valor),virtual:true});
    for(const k of SCN){let sm=spread[k];for(const e of ev)sm+=e.v[k];b[k]+=sm;series[k].push(b[k]);}

}

function analyze(series,piso,saldo){
  const startBelow=saldo<piso;
  let belowIdx=-1,negIdx=-1,recIdx=-1,minV=Infinity,minI=0;
  for(let i=0;i<series.length;i++){
    const v=series[i];
    if(v<minV){minV=v;minI=i;}
    if(!startBelow&&belowIdx<0&&v<piso)belowIdx=i;
    if(negIdx<0&&v<0)negIdx=i;
    if(startBelow&&recIdx<0&&v>=piso)recIdx=i;
  }
  return {startBelow,belowIdx,negIdx,recIdx,minV,minI,fim:series[series.length-1]};
}

function ledger(P,scn,saldo,piso){
  const rows=[];let bal=saldo,acc=0,from=null,to=null,achou=saldo<piso;
  const mark=r=>{r.abaixo=r.saldo<piso;r.neg=r.saldo<0;if(r.abaixo&&!achou){r.primeiro=true;achou=true;}return r;};
  const flush=()=>{if(Math.abs(acc)>=1)rows.push(mark({tipo:'fluxo',de:from,ate:to,valor:acc,saldo:bal}));acc=0;from=null;};
  for(const dy of P.days){
    const sp=dy.spread[scn];acc+=sp;bal+=sp;if(from==null)from=dy.date;to=dy.date;
    if(dy.ev.length){
      flush();
      for(const e of dy.ev){bal+=e.v[scn];rows.push(mark({tipo:'ev',ev:e,date:dy.date,valor:e.v[scn],saldo:bal}));}
    }
  }
  flush();
  return rows;
}

function checarCompra(S,lanc,M,valor){
  const k=M.scn;
  const P2=project(Object.assign({},S,{cfg:M.cfg}),lanc,M.t,M.varM.valor,[{i:0,valor}]);
  const a0=M.A[k],a1=analyze(P2.series[k],M.piso,M.saldo);
  const novoNeg=a1.negIdx>=0&&(a0.negIdx<0||a1.negIdx<a0.negIdx);
  const novoBelow=!a0.startBelow&&a1.belowIdx>=0&&(a0.belowIdx<0||a1.belowIdx<a0.belowIdx);
  const taxa=M.alvoDivida?(M.alvoDivida.taxa||0):0;
  let nivel='cabe';
  if(novoNeg)nivel='nao';
  else if(novoBelow||a0.startBelow)nivel='espere';
  else if(M.dividaCara>0)nivel='atencao';
  return {nivel,a0,a1,jurosMes:valor*taxa/100,taxa};
}

function breakdown(S,lanc,varMensal,k){
  const renda=sum(S.rendas.filter(r=>r.ativa!==false),r=>r[k]);
  const fixas=sum(S.fixas,'valor');
  const cartoes=sum(S.cartoes,'fatura');
  const dividas=sum(S.dividas,d=>dividaSaldo(d,lanc)>0?(d.minimo||0):0);
  const variaveis=varMensal||0;
  const reserva=renda*Math.max(0,(S.cfg.pagueSePct||0)/100);
  const sobra=renda-fixas-cartoes-dividas-variaveis;
  return {renda,fixas,cartoes,dividas,variaveis,reserva,sobra,livre:sobra-reserva,resultado:sobra};
}

function model(S,lanc,t,scn){
  const cfg=S.cfg;

  const dividas=S.dividas.map(d=>({...d,saldoAt:dividaSaldo(d,lanc),rest:parcelasRestantes(d,lanc)}));
  const compromissos=sum(S.fixas,'valor')+sum(S.cartoes,'fatura')+sum(dividas,d=>d.saldoAt>0?(d.minimo||0):0);
  const piso=compromissos*cfg.pisoPct/100;
  const P=project(S,lanc,t,varM.valor);
  const A={};for(const k of SCN)A[k]=analyze(P.series[k],piso,saldo);
  const B={};for(const k of SCN)B[k]=breakdown(S,lanc,varM.valor,k);
  const custoMensal=compromissos+(varM.valor||0);
  const fase1=custoMensal,fase3=custoMensal*cfg.mesesReserva;
  const dividaCara=sum(dividas.filter(d=>DEBT_CARA.includes(d.tipo)),'saldoAt');
  const juros=sum(dividas,d=>d.saldoAt*(d.taxa||0)/100);
  const fase=reserva<fase1?1:(dividaCara>0?2:3);
  const alvoDivida=dividas.filter(d=>DEBT_CARA.includes(d.tipo)&&d.saldoAt>0).sort((a,b)=>(b.taxa||0)-(a.taxa||0))[0]||null;
  const sal=P.events.find(e=>e.kind==='renda'&&e.tipo==='salario');
  let salario=null;
  if(sal)salario={ev:sal,antes:sal.i>0?P.series[scn][sal.i-1]:saldo};
  const gap=Math.max(0,piso-A[scn].minV);
  return {t,cfg,saldo,reserva,varM,dividas,compromissos,piso,P,A,B,custoMensal,fase1,fase3,dividaCara,juros,fase,alvoDivida,salario,gap,scn};
}

/* meses para quitar com um pagamento mensal fixo (juros compostos ao mês) */
function nper(saldo,taxa,pg){
  if(!(saldo>0)||!(pg>0))return null;
  const r=(taxa||0)/100;
  if(r===0)return Math.ceil(saldo/pg);
  if(pg<=saldo*r)return null;
  const n=-Math.log(1-r*saldo/pg)/Math.log(1+r);
  return n>600?null:Math.ceil(n);
}
/* o que fazer com a sobra: reserva obrigatória já descontada, o resto vai para dívida e/ou poupança */
function alocarSobra(M,k){
  const B=M.B[k];
  const out={renda:B.renda,sobra:B.sobra,reserva:B.reserva,livre:B.livre,itens:[],regra:'',alvo:null};
  if(!(B.renda>0)||B.livre<1)return out;
  const abertas=M.dividas.filter(d=>d.saldoAt>0);
  const ord=(a,b)=>(b.taxa||0)-(a.taxa||0)||b.saldoAt-a.saldoAt;
  const cara=abertas.filter(d=>DEBT_CARA.includes(d.tipo)||(d.taxa||0)>=5).sort(ord)[0];
  const outra=abertas.slice().sort(ord)[0];
  const livre=Math.floor(B.livre);
  const completa=M.fase3>0&&M.reserva>=M.fase3;
  let pd=0,alvo=null;
  if(cara){alvo=cara;pd=M.reserva<M.fase1?70:100;out.regra=pd===100?'Há dívida com juro alto e o colchão de 1 mês está pronto: o extra vai todo para a dívida de maior juro.':'Há dívida com juro alto, mas o colchão de 1 mês ainda não está pronto: 70% vai para a dívida de maior juro e 30% para a poupança.';}
  else if(outra){alvo=outra;pd=completa?100:60;out.regra=pd===100?'A reserva está completa: o extra vai para a dívida.':'Há dívida, sem juro alto: 60% para quitar e 40% para engordar a reserva.';}
  else out.regra=completa?'Sem dívidas e com a reserva completa: o extra pode ser investido.':'Sem dívidas abertas: o extra reforça a reserva.';
  const vd=alvo?Math.round(livre*pd/100):0,vr=livre-vd;
  if(vd>0&&alvo){
    const base=alvo.rest!=null?alvo.rest:nper(alvo.saldoAt,alvo.taxa,alvo.minimo||0);
    let com=nper(alvo.saldoAt,alvo.taxa,(alvo.minimo||0)+vd);
    if(alvo.rest!=null&&com!=null)com=Math.min(com,alvo.rest);
    out.itens.push({tipo:'divida',valor:vd,alvo:{id:alvo.id,nome:alvo.nome,taxa:alvo.taxa||0,saldoAt:alvo.saldoAt},juros:vd*(alvo.taxa||0)/100,mesesSem:base,mesesCom:com});
  }
  if(vr>0)out.itens.push({tipo:(!alvo&&completa)?'investimento':'reserva',valor:vr});
  out.alvo=alvo;
  return out;
}

function parseMoney(s){
  if(s==null)return NaN;
  let t=String(s).trim();
  if(!t)return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(/^\s*(R\$)?\s*[-−–]/.test(t)||/[-−–]\s*$/.test(t))neg=true;

  const m=t.match(/([CD])$/i);
  if(m){if(m[1].toUpperCase()==='D')neg=true;t=t.slice(0,-1);}
  if(!/\d/.test(t)||/[^\d.,]/.test(t))return NaN;
  const lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');
  if(lc>=0&&ld>=0){t=lc>ld?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');}
  else if(lc>=0){t=(t.match(/,/g)||[]).length>1?t.replace(/,/g,''):t.replace(',','.');}
  else if(ld>=0){if((t.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(t))t=t.replace(/\./g,'');}
  const n=Number(t);

}
const MES_ABR={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};

function parseDateStr(s){

function decodeBuf(buf){

/* OFX (SGML 1.x e XML 2.x) */
function parseOFX(text){
  const t=String(text).replace(/\r/g,'');
  const tag=(blk,n)=>{const m=blk.match(new RegExp('<'+n+'>\\s*([^<\\n]*)','i'));return m?m[1].trim():'';};
  const rows=[];

  for(const p of parts){

    const data=dt.length===8?ymd(+dt.slice(0,4),+dt.slice(4,6),+dt.slice(6,8)):null;
    let a=tag(p,'TRNAMT');
    let v=a.includes('.')||!a.includes(',')?Number(a):parseMoney(a);
    if(!data||!isFinite(v)||v===0)continue;
    const nome=tag(p,'NAME'),memo=tag(p,'MEMO');
    const desc=[nome,memo].filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(' - ');
    rows.push({data,valor:Math.abs(v),tipo:v<0?'saida':'entrada',desc:desc||tag(p,'TRNTYPE'),fitid:tag(p,'FITID'),sinal:'ok'});
  }
  const lb=t.match(/<LEDGERBAL>[\s\S]*?<BALAMT>\s*([^<\n]*)[\s\S]*?<DTASOF>\s*(\d{8})/i);
  let saldo=null,saldoData=null;
  if(lb){const n=Number(lb[1].replace(',','.'));if(isFinite(n)){saldo=n;saldoData=ymd(+lb[2].slice(0,4),+lb[2].slice(4,6),+lb[2].slice(6,8));}}
  const ds=tag(t,'DTSTART').replace(/\D/g,'').slice(0,8),de=tag(t,'DTEND').replace(/\D/g,'').slice(0,8);
  const cartao=/<CCSTMTRS|<CCACCTFROM|<CREDITCARDMSGSRSV1/i.test(t);

    periodo:[ds.length===8?ymd(+ds.slice(0,4),+ds.slice(4,6),+ds.slice(6,8)):null,de.length===8?ymd(+de.slice(0,4),+de.slice(4,6),+de.slice(6,8)):null]};
}

/* CSV */
function splitCSV(text){
  const lines=String(text).replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  let best=';',bs=-1;
  for(const c of [';','\t','|',',']){
    const counts=lines.slice(0,30).map(l=>{let q=false,n=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===c&&!q)n++;}return n;}).filter(n=>n>0);
    if(!counts.length)continue;
    const freq={};counts.forEach(n=>freq[n]=(freq[n]||0)+1);
    const score=Math.max(...Object.keys(freq).map(n=>n*freq[n]));
    if(score>bs+1e-9){bs=score;best=c;}
  }
  return lines.map(l=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}
      else if(ch===best&&!q){out.push(cur.trim());cur='';}
      else cur+=ch;
    }
    out.push(cur.trim());return out;
  });
}
const HDR=/^(DATA|DATE|DT\b|DESCRI|HISTOR|LANCAMENTO|VALOR|AMOUNT|CREDITO|DEBITO|ENTRADA|SAIDA|SALDO|TITLE|TITULO|ESTABELEC|MEMO|IDENTIFICADOR|DOCUMENTO|DOCTO|DETALHE|TIPO|NATUREZA)/;
function parseCSV(text){

  for(let i=0;i<Math.min(grid.length,40);i++){
    const hits=grid[i].filter(c=>HDR.test(normT(c))).length;
    if(hits>=2){hi=i;break;}
  }
  let cDate=-1,cVal=-1,cCred=-1,cDeb=-1,cTipo=-1,cId=-1,cDesc=[];

      else if(/DEBITO|SAIDA/.test(c))cDeb=i;

      else if(/^(TIPO|NATUREZA|D\/C|DC)$/.test(c))cTipo=i;
      else if(/^(IDENTIFICADOR|ID|CODIGO)$/.test(c))cId=i;
      else if(/DESCRI|HISTOR|LANCAMENTO|ESTABELEC|TITLE|TITULO|MEMO|DETALHE|NOME/.test(c))cDesc.push(i);
    });
  }else{
    body=grid;
    const n=Math.max(...grid.map(r=>r.length),0);
    const frac=f=>{let best=-1,bf=0;for(let i=0;i<n;i++){const k=grid.filter(r=>r[i]!=null&&f(r[i])).length/Math.max(1,grid.length);if(k>bf){bf=k;best=i;}}return bf>=.6?best:-1;};

    let bl=0;for(let i=0;i<n;i++){if(i===cDate||i===cVal)continue;const L=grid.reduce((s,r)=>s+((r[i]||'').length),0)/Math.max(1,grid.length);if(L>bl){bl=L;cDesc=[i];}}
  }
  const rows=[];
  for(const r of body){

    if(!data)continue;

    if(/^(SALDO|TOTAL)\b|SALDO (ANTERIOR|DO DIA|FINAL|INICIAL|DISPONIVEL)/.test(normT(desc)))continue;

    let y=refD.getFullYear();
    let d=ymd(y,mon,day);
    if(d&&new Date(d+'T12:00:00')>new Date(refD.getTime()+31*86400000))d=ymd(y-1,mon,day);
    return d;
  };
  const rows=[],seq=[];let cur=null,prev=null,prevIdx=-2,nSig=0,nIn=0;
  lines.forEach((raw,li)=>{
    const s=String(raw).replace(/\s+/g,' ').trim();
    if(!s)return;
    let rest=s,dd=dateAt(s);
    if(dd){cur=dd.d;rest=s.slice(dd.len).trim();}
    else if(!cur)return;
    if(!cur)return;
    const rn=normT(rest);
    const toks=[...rest.matchAll(RE_MONEY)];
    if(!toks.length){
      if(!dd&&prev&&prevIdx===li-1&&rest.length<50&&/[A-Za-z]/.test(rest)&&!BL_LINE.test(rn)&&!/PAGINA/.test(rn)){prev.desc+=' '+rest;prevIdx=li;}
      return;
    }
    if(BL_LINE.test(rn)){if(/SALDO (ANTERIOR|INICIAL)/.test(rn)){const b0=parseMoney(toks[toks.length-1][0]);if(isFinite(b0))seq.push({pseudo:true,bal:b0});}return;}
    const use=cartao?toks[toks.length-1]:toks[0];
    const raw1=use[0];
    const v=parseMoney(raw1);
    if(!isFinite(v)||v===0)return;
    let desc=rest;
    for(const t of toks)desc=desc.replace(t[0],' ');
    desc=desc.replace(/\s+/g,' ').replace(/^[-–:\s]+|[-–:\s]+$/g,'').trim();
    desc=desc.replace(/^\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s+/,'');
    if(!/[A-Za-z]{2}/.test(desc))return;
    const signed=/[-−–]/.test(raw1.replace(/R\$/,''))||/[D]\s*$/.test(raw1)||/-$/.test(raw1.trim());
    const posC=/C\s*$/.test(raw1);
    if(!cartao){if(signed)nSig++;if(posC||/^\s*\+/.test(raw1))nIn++;}
    let tipo,sinal='ok';
    if(cartao){tipo=signed?'entrada':'saida';}
    else if(signed){tipo='saida';}
    else if(posC){tipo='entrada';}
    else{tipo=IN_WORDS.test(normT(desc))?'entrada':'saida';sinal='guess';}
    const bal=(!cartao&&toks.length>=2)?parseMoney(toks[toks.length-1][0]):null;
    const row={data:cur,valor:Math.abs(v),tipo,desc,fitid:'',sinal,bal:bal!=null&&isFinite(bal)?Math.abs(bal)*(/[-−–]/.test(toks[toks.length-1][0])?-1:1):null};
    rows.push(row);seq.push(row);prev=row;prevIdx=li;
  });
  if(!cartao&&nSig>=3&&nIn===0)rows.forEach(r=>{if(r.sinal==='guess'){r.tipo='entrada';r.sinal='ok';}});
  seq.forEach((r,i)=>{
    if(r.pseudo||r.sinal!=='guess'||r.bal==null)return;
    const p=seq[i-1],n=seq[i+1];
    if(p&&p.bal!=null){const d=r.bal-p.bal;if(Math.abs(d-r.valor)<.011){r.tipo='entrada';r.sinal='ok';return;}if(Math.abs(d+r.valor)<.011){r.tipo='saida';r.sinal='ok';return;}}
    if(n&&n.bal!=null){const d=r.bal-n.bal;if(Math.abs(d-r.valor)<.011){r.tipo='entrada';r.sinal='ok';return;}if(Math.abs(d+r.valor)<.011){r.tipo='saida';r.sinal='ok';return;}}
  });
  return {kind:'pdf',rows};
}

/* ---------- classificação ---------- */
const KW={
  lazer:['IFOOD','RAPPI','UBER EATS','99FOOD','RESTAURANTE','LANCHONETE','PIZZARIA','PIZZA','HAMBURGUER','HAMBURGUERIA','MCDONALD','MCDONALDS','BURGER KING','BK BRASIL','SUBWAY','STARBUCKS','CAFE','CAFETERIA','SORVETERIA','CONFEITARIA','BAR','BOTECO','CHOPP','CHOPERIA','CINEMA','CINEMARK','INGRESSO','SYMPLA','EVENTIM','STEAM','PLAYSTATION','PSN','XBOX','NINTENDO','GOOGLE PLAY','APPLE.COM','ITUNES','NETFLIX','SPOTIFY','DISNEY','HBO MAX','YOUTUBE','DEEZER','GLOBOPLAY','PARAMOUNT','CRUNCHYROLL','AMAZON PRIME','PRIME VIDEO','LIVRARIA','TEATRO'],
  outros:['MERCADO LIVRE','MERCADOLIVRE','MERCADO PAGO','MERCADOPAGO','SHOPEE','AMAZON','ALIEXPRESS','MAGALU','MAGAZINE LUIZA','CASAS BAHIA','SHEIN','AMERICANAS'],
  transporte:['UBER','99 TECNOLOGIA','99 POP','99POP','99APP','CABIFY','INDRIVER','POSTO','SHELL','IPIRANGA','PETROBRAS','BR MANIA','COMBUSTIVEL','METRO','METRORIO','RIOCARD','RIO CARD','BILHETE UNICO','BILHETAGEM','SUPERVIA','ESTACIONAMENTO','ESTAPAR','PEDAGIO','SEM PARAR','CONECTCAR','VELOE','MOVE MAIS','BUSER','CLICKBUS','FLIXBUS','LOCALIZA','MOVIDA','BARCAS','VLT','DETRAN','YELLOW','AUTOPASS'],
  'saúde':['FARMACIA','DROGARIA','DROGASIL','RAIA','PACHECO','PAGUE MENOS','DROGA','UNIMED','AMIL','SULAMERICA','HAPVIDA','NOTREDAME','HOSPITAL','CLINICA','LABORATORIO','DENTISTA','ODONTO','ODONTOLOGIA','MEDICO','CONSULTA','FISIOTERAPIA','PSICOLOGO','PSICOLOGA','TERAPIA','ACADEMIA','SMARTFIT','SMART FIT','BLUEFIT','OPTICA','PANVEL','ULTRAFARMA','VENANCIO'],
  mercado:['SUPERMERCADO','SUPERMERCADOS','SUPERMERC','MERCADO','MERCEARIA','HORTIFRUTI','PADARIA','ACOUGUE','SACOLAO','ATACADAO','ASSAI','CARREFOUR','PAO DE ACUCAR','GUANABARA','ZONA SUL','PREZUNIC','MUNDIAL','SENDAS','BOMPRECO','WALMART','MAKRO','ATACAREJO','EMPORIO','FEIRA','QUITANDA','SAMS CLUB','CASA DE CARNES','PANIFICADORA']
};
const KWC=Object.keys(KW).map(c=>[c,KW[c].map(wordRe)]);
function kwCat(descN){for(const [c,res] of KWC)for(const r of res)if(r.test(descN))return c;return null;}
const RECOR=['ALUGUEL','CONDOMINIO','ENEL','LIGHT','CEG','TELEFONICA','COMGAS','CEDAE','NATURGY','CLARO','VIVO','TIM','OI FIBRA','INTERNET','ENERGIA','AGUA','SEGURO','IPTU','IPVA','MENSALIDADE','ESCOLA','FACULDADE','PLANO DE SAUDE'].map(wordRe);
const SKIP_INV=/(^|[^A-Z0-9])(APLICACAO|APLIC|RESGATE|RDB|CDB|TESOURO|INVESTIMENTO|FUNDO)([^A-Z0-9]|$)/;
const SKIP_OWN=/(ENTRE CONTAS|MESMA TITULARIDADE|TRANSF(ERENCIA)? PROPRIA|PIX PROPRIO|CONTA PROPRIA)/;
const ENCARGO_RE=/(^|[^A-Z])MORA([^A-Z]|$)|JUROS|(^|[^A-Z])IOF([^A-Z]|$)|ENCARGOS?|MULTA|TARIFA|ANUIDADE/;
const FAT_RE=/FATURA|(PAGAMENTO|PGTO|PAGTO) .*CARTAO/;
const PAGTO_CARTAO=/(PAGAMENTO|PGTO|PAGTO).*(RECEBID|FATURA|EFETUAD|ONLINE)|OBRIGADO PELO PAGAMENTO|CREDITO DE PAGAMENTO|PAGAMENTO EM/;
const STOP=new Set(['PIX','ENVIADO','ENVIADA','RECEBIDO','RECEBIDA','TRANSF','TRANSFERENCIA','COMPRA','DEBITO','CREDITO','CARTAO','PAGAMENTO','PGTO','PAGTO','DE','DA','DO','DAS','DOS','EM','COM','PARA','NO','NA','BOLETO','TED','DOC','EFETUADO','EFETUADA','VIA','LTDA','ME','EPP','SA','REF','PARCELA','CONTA','AUT','DEB','CRED','PAG','NUBANK','DEBITO','VISTA']);
function merchKey(desc){
  const toks=normT(desc).replace(/[^A-Z\s]/g,' ').split(' ').filter(t=>t.length>=3&&!STOP.has(t));
  return toks.slice(0,2).join(' ');
}
const tokensOf=s=>normT(s).replace(/[^A-Z0-9\s]/g,' ').split(' ').filter(t=>t.length>=4&&!STOP.has(t));
function nearestComp(dataISO,dia){
  const d=new Date(dataISO+'T12:00:00');let best=null;
  for(const off of [-1,0,1]){
    const y=d.getFullYear(),m=d.getMonth()+off;
    const base=new Date(y,m,1);
    const due=new Date(base.getFullYear(),base.getMonth(),Math.min(dia,dim(base.getFullYear(),base.getMonth())),12);
    const diff=Math.abs(due.getTime()-d.getTime())/86400000;
    if(!best||diff<best.diff)best={comp:mkey(due),diff};
  }
  return best;
}
const near=(v,ref,tol)=>Math.abs(v-ref)<=Math.max(1,ref*tol);

/* sugere o destino de cada linha: v:<categoria> | e:<categoria> | fixa:ID | cartao:ID | divida:ID | plano:ID | renda:ID | skip */
function sugerir(row,file,S,used){
  const dn=normT(row.desc);
  const regras=S.regras||{};
  const key=merchKey(row.desc);
  const ok=a=>{
    if(a==='skip')return true;
    const [k,id]=a.split(':');
    if(k==='v')return row.tipo==='saida';
    if(k==='e')return row.tipo==='entrada';
    const arr={fixa:S.fixas,cartao:S.cartoes,divida:S.dividas,plano:S.planejados,renda:S.rendas}[k];
    if(!arr||!arr.some(x=>x.id===id))return false;
    if(k==='renda')return row.tipo==='entrada';
    if(k==='plano')return true;
    return row.tipo==='saida';
  };
  const out={alvo:null,nota:null,rec:false};
  if(file.alvo==='cartao'){
    if(row.tipo==='entrada'&&PAGTO_CARTAO.test(dn)){out.alvo='skip';out.nota='pagamento da fatura (já saiu da conta)';return out;}
    if(key&&regras[key]&&ok(regras[key])){out.alvo=regras[key];return out;}
    if(row.tipo==='entrada'){out.alvo='e:outros';return out;}
    out.alvo='v:'+(kwCat(dn)||'outros');return out;
  }
  if(/PIX RECUSAD|TRANSFERENCIA RECUSAD|PAGAMENTO RECUSAD/.test(dn)){out.alvo='skip';out.nota='operação recusada pelo banco';return out;}
  const own=((S.cfg&&S.cfg.meusNomes)||[]).concat(file.donos||[]);
  if(own.length&&TR_RE.test(dn)&&own.some(n=>dn.includes(n))){out.alvo='skip';out.nota='transferência entre suas contas';out.own=true;return out;}
  if(key&&regras[key]&&ok(regras[key])){out.alvo=regras[key];out.nota='regra aprendida';return out;}
  const free=(id,comp)=>!used.has(id+'|'+comp);
  if(row.tipo==='entrada'){
    let bestR=null;
    for(const r of S.rendas){
      if(r.ativa===false||r.dia==null)continue;
      const nc=nearestComp(row.data,r.dia);
      if(nc.diff>7||!free(r.id,nc.comp))continue;
      if(row.valor>=r.min*0.85&&row.valor<=r.max*1.15){if(!bestR||nc.diff<bestR.diff)bestR={r,diff:nc.diff};}
    }
    if(bestR){out.alvo='renda:'+bestR.r.id;out.nota='liga a '+bestR.r.nome;return out;}
    for(const p of (S.planejados||[])){if(p.tipo==='entrada'&&free(p.id,'one')&&near(row.valor,p.valor,.01)&&isoDiff(row.data,p.data)<=5){out.alvo='plano:'+p.id;out.nota='liga a '+p.nome;return out;}}
    if(SKIP_OWN.test(dn)||SKIP_INV.test(dn)){out.alvo='skip';out.nota=SKIP_OWN.test(dn)?'transferência própria':'investimento';return out;}
    out.alvo='e:outros';return out;
  }
  if(FAT_RE.test(dn)&&S.cartoes.length){
    let pick=null;
    for(const c of S.cartoes){const th=tokensOf(c.nome).some(t=>dn.includes(t));const nc=nearestComp(row.data,c.venc);if(!free(c.id,nc.comp))continue;
      const sc=(th?2:0)+(near(row.valor,c.fatura,.4)&&nc.diff<=7?1:0);if(sc>0&&(!pick||sc>pick.sc))pick={c,sc};}
    if(!pick&&S.cartoes.length===1){const c=S.cartoes[0];const nc=nearestComp(row.data,c.venc);if(free(c.id,nc.comp))pick={c,sc:1};}
    if(pick){out.alvo='cartao:'+pick.c.id;out.nota='liga a fatura '+pick.c.nome;return out;}
  }
  if(FAT_RE.test(dn)){out.alvo='v:fatura';out.nota='fatura de cartão';return out;}
  let bf=null;
  for(const f of S.fixas){
    const nc=nearestComp(row.data,f.dia);if(!free(f.id,nc.comp))continue;
    const nameHit=tokensOf(f.nome).some(t=>dn.includes(t));
    const valClose=near(row.valor,f.valor,.03);
    let sc=0;
    if(nameHit&&near(row.valor,f.valor,.4))sc=2+(valClose?1:0);
    else if(valClose&&nc.diff<=(f.valor>=100?10:4))sc=1;
    if(sc>0&&(!bf||sc>bf.sc||(sc===bf.sc&&nc.diff<bf.diff)))bf={f,sc,diff:nc.diff};
  }
  if(bf){out.alvo='fixa:'+bf.f.id;out.nota='liga a '+bf.f.nome;return out;}
  let bd=null;
  for(const d of S.dividas){
    if(!(d.minimo>0))continue;
    const nameHit=tokensOf(d.nome).some(t=>dn.includes(t));
    const nc=d.dia!=null?nearestComp(row.data,d.dia):{comp:mkey(new Date(row.data+'T12:00:00')),diff:0};
    if(!free(d.id,nc.comp))continue;
    const sc=nameHit&&near(row.valor,d.minimo,.5)?2:(d.dia!=null&&near(row.valor,d.minimo,.03)&&nc.diff<=4?1:0);
    if(sc>0&&(!bd||sc>bd.sc))bd={d,sc};
  }
  if(bd){out.alvo='divida:'+bd.d.id;out.nota='liga a '+bd.d.nome;return out;}
  for(const p of (S.planejados||[])){if(p.tipo==='saida'&&free(p.id,'one')&&near(row.valor,p.valor,.01)&&isoDiff(row.data,p.data)<=5){out.alvo='plano:'+p.id;out.nota='liga a '+p.nome;return out;}}
  if(SKIP_OWN.test(dn)){out.alvo='skip';out.nota='transferência própria';return out;}
  if(SKIP_INV.test(dn)){out.alvo='skip';out.nota='investimento';return out;}
  if(ENCARGO_RE.test(dn)){out.alvo='v:encargos';out.nota='juros e encargos';return out;}
  const k=kwCat(dn);
  out.rec=RECOR.some(r=>r.test(dn));
  if(!k&&(out.rec||(BANCO_RE.test(dn)&&TR_RE.test(dn)))){out.alvo='v:contas';out.nota='conta ou parcela recorrente';return out;}
  out.alvo='v:'+(k||'outros');
  return out;
}

/* converte o destino escolhido nos campos do lançamento */
function resolverAlvo(alvo,row,S){
  const [k,id]=String(alvo).split(':');
  if(k==='v')return {categoria:id};
  if(k==='e')return {categoria:id};
  const f={
    fixa:()=>{const x=S.fixas.find(z=>z.id===id);return x&&{categoria:'conta_fixa',refId:id,comp:nearestComp(row.data,x.dia).comp};},
    cartao:()=>{const x=S.cartoes.find(z=>z.id===id);return x&&{categoria:'fatura',refId:id,comp:nearestComp(row.data,x.venc).comp};},
    divida:()=>{const x=S.dividas.find(z=>z.id===id);return x&&{categoria:'divida_min',refId:id,comp:x.dia!=null?nearestComp(row.data,x.dia).comp:row.data.slice(0,7)};},
    plano:()=>{const x=(S.planejados||[]).find(z=>z.id===id);return x&&{categoria:'planejado',refId:id,comp:'one'};},
    renda:()=>{const x=S.rendas.find(z=>z.id===id);return x&&(x.dia!=null?{categoria:x.tipo,refId:id,comp:nearestComp(row.data,x.dia).comp}:{categoria:x.tipo});}
  }[k];
  const r=f&&f();
  return r||{categoria:row.tipo==='entrada'?'outros':'outros'};
}

/* identificadores para evitar duplicatas */
function extKey(file,row,occ){
  const scope=file.alvo==='cartao'?('c'+file.cartaoId):('b'+normT(file.banco||'?').replace(/\W/g,''));
  if(row.fitid)return ('o|'+scope+'|'+row.fitid).slice(0,80);
  return ('h|'+scope+'|'+row.data+'|'+Math.round(row.valor*100)+'|'+row.tipo[0]+'|'+normT(row.desc).replace(/[^A-Z]/g,'').slice(0,20)+'|'+occ).slice(0,100);
}

/* prepara as linhas de um arquivo: inversão de sinal, destino sugerido, duplicatas */
function prepararArquivo(file,S,lanc){
  const used=new Set();
  for(const l of lanc)if(l.refId&&l.comp)used.add(l.refId+'|'+l.comp);
  const exts=new Set();
  for(const l of lanc)if(l.ext)exts.add(l.ext);
  const occ={};
  const consumed=new Set();
  const cand=lanc.filter(l=>!l.ext||true);
  const rows=[];
  file.raw.forEach(r0=>{
    const r=Object.assign({},r0);
    if(file.inv)r.tipo=r.tipo==='entrada'?'saida':'entrada';
    const base=r.data+'|'+r.valor+'|'+r.tipo+'|'+normT(r.desc);
    occ[base]=(occ[base]||0)+1;
    r.ext=extKey(file,r,occ[base]);
    const s=sugerir(r,file,S,used);
    r.alvo=s.alvo;r.auto=s.alvo;r.nota=s.nota;r.rec=s.rec;r.own=!!s.own;
    if(s.alvo&&/^(fixa|cartao|divida|renda):/.test(s.alvo)){
      const fx=resolverAlvo(s.alvo,r,S);if(fx.refId)used.add(fx.refId+'|'+fx.comp);
    }
    r.inc=r.alvo!=='skip';
    r.dup=null;
    if(exts.has(r.ext)){r.dup='ext';r.inc=false;}
    else{
      const c=cand.find(l=>!consumed.has(l.id)&&l.tipo===r.tipo&&Math.abs(l.valor-r.valor)<.005&&l.data&&isoDiff(l.data,r.data)<=3&&(file.alvo==='cartao'?l.cartaoId===file.cartaoId:!l.cartaoId));
      if(c){consumed.add(c.id);r.dup='manual';r.inc=false;}
    }
    rows.push(r);
  });
  file.rows=rows;
  return file;
}

/* transferências entre contas do próprio usuário, vistas em dois arquivos do mesmo lote */
function parearTransferencias(files){
  const rs=[];
  files.forEach(f=>{if(f.alvo!=='conta')return;f.rows.forEach(r=>{r.pareado=false;if(r.par){r.par=false;r.alvo=r.auto;r.nota=r.nota==='transferência entre suas contas'?null:r.nota;r.inc=r.alvo!=='skip'&&!r.dup;}rs.push({f,r});});});
  const TR=/(PIX|TED|DOC|TRANSF)/;
  const elig=x=>!x.r.par&&!x.r.dup&&['v:outros','e:outros','v:contas'].includes(x.r.alvo)&&TR.test(normT(x.r.desc))&&!CP_RE.test(normT(x.r.desc));
  for(const a of rs){
    const A=a.r;
    if(A.par||A.dup||!elig(a))continue;
    const op=A.tipo==='saida'?'entrada':'saida';
    const b=rs.find(x=>x.f!==a.f&&!(x.f.banco&&x.f.banco===a.f.banco)&&!x.r.par&&!x.r.pareado&&!x.r.dup&&x.r.tipo===op&&Math.abs(x.r.valor-A.valor)<.005&&isoDiff(x.r.data,A.data)<=(x.r.own?2:1)&&(elig(x)||x.r.own));
    if(b){
      A.par=true;A.alvo='skip';A.inc=false;A.nota='transferência entre suas contas';
      if(b.r.own)b.r.pareado=true;else{b.r.par=true;b.r.alvo='skip';b.r.inc=false;b.r.nota='transferência entre suas contas';}
    }
  }
}

/* palpites de banco e tipo a partir do nome do arquivo e do conteúdo */
function palpiteBanco(texto,bancos){
  const T=' '+normT(texto).replace(/[^A-Z0-9]+/g,' ')+' ';
  const lista=[...bancos].sort((a,b)=>b.length-a.length);
  for(const b of lista){
    const toks=normT(b).split(' ').filter(t=>t.length>=2);
    if(toks.length&&toks.every(t=>T.includes(' '+t+' ')))return b;
  }
  return '';
}
function palpiteCartao(texto,cartoes){
  const T=' '+normT(texto).replace(/[^A-Z0-9]+/g,' ')+' ';
  const sorted=[...cartoes].sort((a,b)=>b.nome.length-a.nome.length);
  for(const c of sorted){const toks=normT(c.nome).split(' ').filter(t=>t.length>=2);if(toks.length&&toks.every(t=>T.includes(' '+t+' ')))return c.id;}
  return cartoes.length===1?cartoes[0].id:'';
}

function grupoGasto(l){
  const dn=normT(l.desc||'');
  for(const g of GR)if(g.re.test(dn))return g;
  if(l.categoria==='lazer'||l.categoria==='outros'){
    const key=merchKey(l.desc||'');
    if(key)return {id:'m:'+key,nome:key.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()),frac:.5,min:100};
  }

}
const r10=n=>Math.round(n/10)*10;
function habitos(S,lanc,t){
  const cur=mkey(t);
  const prev=[1,2,3].map(n=>mkey(new Date(t.getFullYear(),t.getMonth()-n,1,12)));
  const el=lanc.filter(l=>l.tipo==='saida'&&l.data&&!EXCL_H.has(l.categoria));
  const cont={};
  el.forEach(l=>{const m=l.data.slice(0,7);cont[m]=(cont[m]||0)+1;});
  const base=prev.filter(m=>(cont[m]||0)>=8);
  const out={cur,prev,janela:[],parcial:false,status:'ok',itens:[],metas:[],economia:0};
  if(base.length)out.janela=base;
  else if((cont[cur]||0)>=8){out.janela=[cur];out.parcial=true;}
  else out.status='semdados';
  const por={};
  for(const l of el){
    const m=l.data.slice(0,7);
    if(m!==cur&&prev.indexOf(m)<0)continue;
    const g=grupoGasto(l);if(!g)continue;
    const o=por[g.id]||(por[g.id]={g,meses:{}});
    const x=o.meses[m]||(o.meses[m]={v:0,n:0});
    x.v+=l.valor;x.n++;
  }
  const lim=S.limites||[];
  const val=(o,m)=>(o&&o.meses[m]?o.meses[m].v:0);
  if(out.status==='ok'){
    const nj=out.janela.length;
    for(const id of Object.keys(por)){
      const o=por[id],g=o.g;
      const tot=out.janela.reduce((s,m)=>s+val(o,m),0),n=out.janela.reduce((s,m)=>s+(o.meses[m]?o.meses[m].n:0),0);
      const avg=tot/nj;
      if(avg<g.min)continue;
      const limite=g.frac===0?0:Math.max(10,r10(avg*g.frac));
      if(limite>=avg)continue;
      out.itens.push({id,nome:g.nome,avg,n:n/nj,atual:val(o,cur),ultimo:val(o,prev[0]),limite,economia:avg-limite,grave:!!g.grave,taxa:!!g.taxa,aceita:lim.some(x=>x.id===id)});
    }
    out.itens.sort((a,b)=>(b.grave?1e9:0)+b.economia-((a.grave?1e9:0)+a.economia));
    out.itens=out.itens.slice(0,5);
    out.economia=out.itens.reduce((s,x)=>s+x.economia,0);
  }
  out.metas=lim.map(x=>({id:x.id,nome:x.nome,limite:x.limite,atual:val(por[x.id],cur),ultimo:val(por[x.id],prev[0])}));
  return out;
}

const TR_RE=/(^|[^A-Z0-9])(PIX|TED|DOC|TRANSF[A-Z]*)([^A-Z0-9]|$)/;
const CP_RE=/(?:PIX|TED|DOC|TRANSF[A-Z]*)\s+(?:ENVIAD[AO]|RECEBID[AO])(?:\s+C6)?\s+(?:PARA|DE)\s+(.+)$/;
const GEN_KEYS=new Set(['ELO','APP ELO','VISA','MASTERCARD','CARTAO','DEBITO','PIX','OUTROS GASTOS','SAIDA PIX','ENTRADA PIX','COD LANC','RENTAB INVEST']);
const nameToks=s=>normT(s).replace(/[^A-Z\s]/g,' ').split(' ').filter(t=>t.length>=3&&!STOP.has(t));
const tcase=s=>String(s).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const medOf=a=>{const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;};
function cpKey(desc){
  const dn=normT(desc),m=dn.match(CP_RE);
  if(m)return nameToks(m[1]).slice(0,2).join(' ');
  return merchKey(desc);
}
/* nome do titular no cabeçalho do PDF: "NOME SOBRENOME • 000.000.000-00" */
function nomeDono(lines){
  for(const raw of (lines||[]).slice(0,40)){
    const m=normT(raw).match(/^([A-Z ]{10,}?)\s*(?:•|\d{3}\.\d{3}\.\d{3}-\d{2})/);
    if(m){const t=m[1].trim().split(' ').filter(x=>x.length>=3);if(t.length>=2)return t.slice(0,2).join(' ');}
  }
  return null;
}
/* quem aparece nos dois sentidos de Pix, várias vezes, é você mesmo em outra conta */
function detectarDonos(files){
  const set=new Set(),cnt={};
  (files||[]).forEach(f=>{
    if(f.dono)set.add(f.dono);
    if(f.alvo!=='conta')return;
    (f.raw||[]).forEach(r=>{
      const m=normT(r.desc).match(CP_RE);if(!m)return;
      const k=nameToks(m[1]).slice(0,2).join(' ');if(!k||k.indexOf(' ')<0)return;
      const o=cnt[k]||(cnt[k]={e:0,s:0});
      if(r.tipo==='entrada')o.e++;else o.s++;
    });
  });
  Object.keys(cnt).forEach(k=>{if(cnt[k].e>=3&&cnt[k].s>=2)set.add(k);});
  return Array.from(set);
}
function resumoProprio(files){
  let e=0,s=0,n=0;
  (files||[]).forEach(f=>{if(f.alvo!=='conta')return;(f.rows||[]).forEach(r=>{
    if(!r.own||r.pareado||r.dup)return;
    n++;if(r.tipo==='entrada')e+=r.valor;else s+=r.valor;
  });});
  return {e:round2(e),s:round2(s),n};
}

const REC_EXCL=new Set(['conta_fixa','fatura','divida_min','divida','planejado','reserva','investimento','encargos']);
const BANCO_RE=/(^| )(ITAU|BRADESCO|SANTANDER|NUBANK|INTER|BANCO|CAIXA|BMG|PAN|PICPAY|MERCADO PAGO|FACTA|OLE|DAYCOVAL)( |$)/;
/* rendas, contas fixas e parcelas que se repetem em pelo menos 2 meses dos últimos 4 */
function detectarRecorrentes(S,lanc,t){
  const lim=iso(new Date(t.getFullYear(),t.getMonth()-4,1,12));
  const ign=(S.cfg&&S.cfg.ignorados)||[];
  const jaTem=key=>[].concat(S.rendas||[],S.fixas||[],S.dividas||[],S.cartoes||[]).some(x=>tokensOf(x.nome||'').some(tk=>key.indexOf(tk)>=0));
  const grupos={};
  for(const l of lanc){
    if(!l.data||l.data<lim||REC_EXCL.has(l.categoria)||l.refId)continue;
    const dn=normT(l.desc);
    if(/DEVOL|ESTORN|EST COMPRA|RECUSAD/.test(dn))continue;
    if(l.tipo==='saida'&&/DEBITO DE CARTAO|COMPRA (ELO|DEBITO|NO DEBITO)|COMPRA DEBITO|CARTAO \d{4}|DEBITO APP/.test(dn))continue;
    if(l.tipo==='entrada'&&/IFOOD|AIRBNB|UBER|SHOPEE|AMAZON|MERCADO LIVRE|MERCADO PAGO|RENTAB/.test(dn))continue;
    const key=cpKey(l.desc);
    if(!key||key.length<4||GEN_KEYS.has(key))continue;
    if(l.tipo==='saida'&&kwCat(dn)&&!RECOR.some(r=>r.test(dn)))continue;
    const gk=l.tipo+'|'+key;
    const g=grupos[gk]||(grupos[gk]={tipo:l.tipo,key,meses:{},dias:[],banco:l.banco||''});
    const m=l.data.slice(0,7);
    g.meses[m]=(g.meses[m]||0)+l.valor;g.dias.push(+l.data.slice(8,10));
  }
  const out=[];
  for(const gk of Object.keys(grupos)){
    const g=grupos[gk],ms=Object.keys(g.meses);
    if(ms.length<2||jaTem(g.key)||ign.indexOf(gk)>=0)continue;
    const vals=ms.map(m=>g.meses[m]),md=medOf(vals);
    if(md<(g.tipo==='entrada'?100:40))continue;
    if(vals.filter(v=>Math.abs(v-md)<=md*.35).length/vals.length<.6)continue;
    const dia=Math.min(28,Math.max(1,Math.round(medOf(g.dias))));
    const nome=tcase(g.key),valor=Math.round(md);
    let kind;
    if(g.tipo==='entrada')kind='renda';
    else if(BANCO_RE.test(g.key))kind='divida';
    else kind='fixa';
    out.push({k:gk,kind,nome:kind==='divida'?nome+' (parcela)':nome,valor,dia,meses:ms.length,banco:g.banco,
      tipoRenda:kind==='renda'?(g.key.indexOf(' ')>0?'aulas':'outro'):null});
  }
  out.sort((a,b)=>b.valor-a.valor);
  return out.slice(0,24);
}

/* sinais de dívida nos extratos: juros de limite, crédito pessoal, consignado, mora, fatura pendente */
const SINAIS=[
  {id:'atraso',nome:'Encargos e mora por atraso',tipo:'outro',tok:['MORA','ATRASO'],re:/(^|[^A-Z])MORA([^A-Z]|$)|MULTA POR ATRASO|JUROS DE MORA/},
  {id:'fatpend',nome:'Fatura de cartão pendente',tipo:'rotativo',tok:['FATURA','CARTAO'],re:/PGTO PEND|PAGAMENTO PENDENTE|FATURA EM ATRASO|FATURA VENCIDA/},
  {id:'cheque',nome:'Limite da conta / cheque especial',tipo:'cheque_especial',tok:['LIMITE','CHEQUE','ESPECIAL'],re:/JUROS (DE |DO |DA )?(EXCESSO|LIMITE|LIM )|JUROS.*LIM.*CONTA|CHEQUE ESPECIAL|ADIANT(AMENTO)? A DEPOSITANTE/},
  {id:'pessoal',nome:'Crédito pessoal',tipo:'emprestimo',tok:['PESSOAL','CREDITO','EMPRESTIMO'],re:/CREDITO PESSOAL|EMPRESTIMO PESSOAL|PARCELA EMPRESTIMO/},
  {id:'consig',nome:'Crédito consignado',tipo:'emprestimo',tok:['CONSIGNAD'],re:/CONSIGNAD/}
];
function sinaisDivida(S,lanc,t){
  const lim=iso(new Date(t.getFullYear(),t.getMonth()-4,1,12));
  const ign=(S.cfg&&S.cfg.ignorados)||[];
  const por={};
  for(const l of lanc){
    if(!l.data||l.data<lim||l.tipo!=='saida')continue;
    const dn=normT(l.desc);
    const s=SINAIS.find(x=>x.re.test(dn));if(!s)continue;
    const g=por[s.id]||(por[s.id]={s,total:0,n:0,ultimo:'',vals:[],dias:[],banco:l.banco||''});
    g.total+=l.valor;g.n++;g.vals.push(l.valor);g.dias.push(+l.data.slice(8,10));if(l.data>g.ultimo)g.ultimo=l.data;
  }
  const out=[];
  for(const id of Object.keys(por)){
    const g=por[id];
    const cad=(S.dividas||[]).some(d=>normT(d.nome).split(' ').some(w=>g.s.tok.some(tk=>w.indexOf(tk)===0))||(id==='cheque'&&d.tipo==='cheque_especial'));
    if(cad||ign.indexOf('sinal|'+id)>=0)continue;
    const parcela=(id==='pessoal'||id==='consig')?Math.round(medOf(g.vals)):null;
    out.push({k:'sinal|'+id,id,nome:g.s.nome,tipo:g.s.tipo,total:round2(g.total),n:g.n,ultimo:g.ultimo,banco:g.banco,
      minimo:parcela,dia:parcela?Math.round(medOf(g.dias)):null});
  }
  return out.sort((a,b)=>b.total-a.total);
}

function act(a,d){
  if(a.indexOf('imp-')===0)return impAct(a,d);
  switch(a){
    case 'tab':case 'go':goTo(d.v);break;
    case 'dia':ui.dia=Number(d.i);render();break;
    case 'open':ui.open[d.id]=!ui.open[d.id];render();break;
    case 'aloc':alocar(d);break;
    case 'lim-ok':limAceitar(d.id);break;
    case 'det-add':{const x=guiaItens().det.find(z=>z.k===d.k);if(x)detAdd(x);break;}
    case 'det-all':{guiaItens().det.filter(x=>x.kind!=='divida').forEach(x=>detAdd(x,true));persist();render();toast('Adicionado ao cadastro.');break;}
    case 'kpi-edit':ui.kpiEdit=!ui.kpiEdit;render(['cfg-']);if(ui.kpiEdit){const el=document.getElementById('cfg-saldo');if(el)el.focus();}break;
    case 'det-ign':S.cfg.ignorados=(S.cfg.ignorados||[]).concat(d.k);persist();render();break;
    case 'sin-add':{const x=guiaItens().sin.find(z=>z.k===d.k);if(x)preDivida({nome:x.nome,tipo:x.tipo,minimo:x.minimo,dia:x.dia,banco:x.banco});break;}
    case 'lim-del':S.limites=(S.limites||[]).filter(x=>x.id!==d.id);persist();render();break;
    case 'lf-tipo':ui.lf.tipo=d.v;render(['lf-o','lf-desc','lf-data']);break;
    case 'lf-kind':ui.lf.kind=d.v;ui.editing=null;ui.pre=null;render(['lf-kind']);goTo('lancamentos');break;
    case 'pay':ui.confirm=d.key;render(['cf-']);break;
    case 'pay-cancel':ui.confirm=null;render(['cf-']);break;
    case 'pay-ok':payOk(d.key);break;
    case 'del-arm':ui.delArm=d.id;render();break;
    case 'del-cancel':ui.delArm=null;render();break;
    case 'tema':aplicaTema(d.v);render();break;
    case 'meta-edit':ui.metaEdit=d.id;ui.delArm=null;render(['me-']);document.getElementById('me-nome')?.focus();break;
    case 'meta-cancel':ui.metaEdit=null;ui.delArm=null;render(['me-']);break;
    case 'meta-del-arm':ui.delArm='meta:'+d.id;render();break;
    case 'meta-del':S.metas=(S.metas||[]).filter(m=>m.id!==d.id);ui.metaEdit=null;ui.delArm=null;persist();render(['me-']);toast('Meta excluída.');break;
    case 'gp-modo':(ui.gp=ui.gp||{}).modo=d.v;render(['gp-']);break;
    case 'ev-edit':ui.evEdit=d.key;ui.delArm=null;render(['ev-']);document.getElementById('ev-valor')?.focus();break;
    case 'ev-cancel':ui.evEdit=null;ui.delArm=null;render(['ev-']);break;
    case 'ev-done':evDone(d.key);break;
    case 'ev-del-arm':ui.delArm='ev:'+d.key;render();break;
    case 'ev-del':{const e=evAchar(d.key),al=e&&evAlvo(e);if(al&&al.x&&al.sec==='lanc'){delLanc(al.x.id);toast('Excluído.');}else if(al&&al.x){S[al.sec]=S[al.sec].filter(z=>z.id!==al.x.id);persist();toast('Excluído.');}ui.evEdit=null;ui.delArm=null;render(['ev-']);break;}
    case 'del-lanc':ui.delArm=null;delLanc(d.id);break;
    case 'del-item':{const arr=S[d.sec];S[d.sec]=arr.filter(x=>x.id!==d.id);ui.delArm=null;ui.editing=null;persist();render(['f-'+d.sec]);break;}
    case 'edit':ui.editing={sec:d.sec,id:d.id};ui.lf.kind=SEC_KIND[d.sec]||ui.lf.kind;render(['f-'+d.sec,'lf-kind']);goTo('lancamentos');break;
    case 'edit-cancel':ui.editing=null;render(['f-'+d.sec]);break;
    case 'toggle-sem':S.cfg[d.k]=!S.cfg[d.k];persist();render();break;
  }
}


function val(form,id){const el=form.querySelector('#'+id);return el?el.value:'';}
function submit(name,f){
  if(!S)return;
  if(name==='imppass'){
    const pw=val(f,'imp-pass'),pd=ui.imp.pass;if(!pd)return;
    ui.imp.pass=null;ui.imp.busy=true;render(['imp-pass']);
    lerUm(pd.file,pw).then(()=>{ui.imp.busy=false;impAll();render(['imp-pass']);});
    return;
  }
  if(name==='lanc'){
    const v=num(val(f,'lf-valor'));
    if(!(v>0)){toast('Informe um valor maior que zero.');return;}
    const tipo=ui.lf.tipo,desc=val(f,'lf-desc').trim(),hoje=iso(todayD());
    if(tipo==='meta'){
      if(!desc){toast('Diga o que você quer comprar.');return;}
      const dt=val(f,'lf-data');
      (S.metas=S.metas||[]).push({id:uid(),nome:desc,valor:v,data:/^\d{4}-\d{2}-\d{2}$/.test(dt)?dt:'',obs:''});
      persist();toast('Meta salva: '+desc+', '+brl(v)+'.');
      render(['lf-valor','lf-desc','lf-data']);return;
    }
    const data=val(f,'lf-data')||hoje;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){toast('Informe uma data válida.');return;}
    const o=lfO(),dn=normT(desc);
    const cat=tipo==='entrada'?(/AULA/.test(dn)?'aulas':(/SALARIO/.test(dn)||o==='renda'?'salario':'outros'))
      :({fixa:'contas',cartao:'fatura',parcela:'divida',reserva:'reserva',investimento:'investimento',meta:'meta'}[o]||kwCat(dn)||'outros');
    const rep=!!(f.querySelector('#lf-rep')||{}).checked;
    let refMeta=null;
    if(cat==='meta'){const mp=metaPrincipal();if(!mp){toast('Crie uma meta primeiro, no botão Meta.');return;}refMeta=mp.m;}
    const rot=(LF_TIPOS[tipo].find(x=>x[0]===o)||[0,'Lançamento'])[1];
    const nome=desc||(refMeta?'Guardado para '+refMeta.nome:rot);
    if(rep){
      const id=uid(),dia=Math.min(28,+data.slice(8,10));
      if(tipo==='saida')S.fixas.push({id,nome,valor:v,dia,banco:''});
      else S.rendas.push({id,nome,tipo:cat==='aulas'?'aulas':(cat==='salario'?'salario':'outro'),dia,min:v,base:v,max:v,ativa:true,banco:''});
      persist();
      if(data<=hoje)addLanc({tipo,valor:v,categoria:tipo==='saida'?'conta_fixa':cat,refId:id,comp:nearestComp(data,dia).comp,desc:nome,data,ts:tsFor(data)});
      toast(nome+': '+brl(v)+' todo dia '+dia+'. Já está no calendário.');
    }else if(refMeta){
      addLanc({tipo:'saida',valor:v,categoria:'meta',refId:refMeta.id,desc:nome,data,ts:tsFor(data)});
      toast(brl(v)+' guardados para '+refMeta.nome+'.');
    }else if(data>hoje&&cat!=='reserva'&&cat!=='investimento'){S.planejados.push({id:uid(),nome,tipo,valor:v,data});persist();toast((tipo==='saida'?'Saída':'Entrada')+' de '+brl(v)+' planejada para '+fISO(data)+'.');}
    else{addLanc({tipo,valor:v,categoria:cat,desc:nome,data,ts:tsFor(data)});toast(cat==='reserva'?brl(v)+' guardados na reserva.':(tipo==='saida'?'Saída':'Entrada')+' de '+brl(v)+' lançada.');}
    render(['lf-valor','lf-desc','lf-data','lf-rep']);
    return;
  }
  if(name==='ev'){
    const key=f.dataset.key,e=evAchar(key),al=e&&evAlvo(e);
    if(!al||!al.x){ui.evEdit=null;render();return;}
    const x=al.x,v=num(val(f,'ev-valor'));
    if(!(v>0)){toast('Informe um valor maior que zero.');return;}
    if(e.kind==='lanc'){
      const dt=val(f,'ev-data');if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){toast('Informe uma data válida.');return;}
      const nm=f.querySelector('#ev-nome'),novo=Object.assign({},x,{valor:v,data:dt,ts:tsFor(dt),desc:(nm&&nm.value.trim())||x.desc});
      ui.evEdit=null;salvaLanc(novo);render(['ev-']);toast('Salvo.');return;
    }
    const nm=f.querySelector('#ev-nome');if(nm&&nm.value.trim())x.nome=nm.value.trim();
    if(e.kind==='plano'){const dt=val(f,'ev-data');if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){toast('Informe uma data válida.');return;}x.data=dt;x.valor=v;}
    else{
      const dia=Math.round(num(val(f,'ev-dia')));if(!(dia>=1&&dia<=31)){toast('O dia vai de 1 a 31.');return;}
      if(e.kind==='renda'){x.min=v;x.base=v;x.max=v;x.dia=dia;}
      else if(e.kind==='cartao'){x.fatura=v;x.venc=dia;}
      else if(e.kind==='divida'){x.minimo=v;x.dia=dia;const tx=num(val(f,'ev-taxa')),sd=num(val(f,'ev-saldo'));if(!isNaN(tx)&&tx>=0)x.taxa=tx;if(!isNaN(sd)&&sd>=0)x.saldo=sd;}
      else{x.valor=v;x.dia=dia;}
    }
    ui.evEdit=null;persist();render(['ev-']);toast('Salvo.');return;
  }
  if(name==='meta-ed'){
    const m=(S.metas||[]).find(x=>x.id===f.dataset.id);if(!m){ui.metaEdit=null;render();return;}
    const nome=val(f,'me-nome').trim(),v=num(val(f,'me-valor')),dt=val(f,'me-data');
    if(!nome){toast('Diga o que você quer comprar.');return;}
    if(!(v>0)){toast('Informe um valor maior que zero.');return;}
    m.nome=nome;m.valor=v;m.data=/^\d{4}-\d{2}-\d{2}$/.test(dt)?dt:'';
    ui.metaEdit=null;persist();render(['me-']);toast('Meta atualizada.');return;
  }
  if(name==='compra'){
    const v=num(val(f,'cp-valor'));if(!(v>0)){toast('Informe o valor da compra.');return;}
    ui.compra={nome:val(f,'cp-nome').trim(),valor:v};render();return;
  }
  if(name==='saldos'){
    const s=num(val(f,'cfg-saldo')),r=num(val(f,'cfg-reserva')),iv=num(val(f,'cfg-invest'));
    if(isNaN(s)||isNaN(r)||r<0||(!isNaN(iv)&&iv<0)){toast('Informe o saldo da conta, a reserva e os investimentos.');return;}
    const now=Date.now();S.cfg.saldoInformado=true;S.cfg.saldo=s;S.cfg.saldoTs=now;S.cfg.reserva=r;S.cfg.reservaTs=now;S.cfg.investimento=isNaN(iv)?0:iv;S.cfg.investimentoTs=now;
    ui.kpiEdit=false;persist();render(['cfg-saldo','cfg-reserva','cfg-invest']);toast('Saldo e reserva atualizados.');return;
  }
  if(name==='params'){
    const piso=num(val(f,'cfg-piso')),mr=num(val(f,'cfg-mr')),ps=num(val(f,'cfg-ps')),vh=num(val(f,'cfg-vh')),vm=num(val(f,'cfg-vm'));
    if(isNaN(piso)||piso<0||piso>100||isNaN(mr)||mr<1||isNaN(ps)||ps<1||ps>100){toast('Confira o piso, os meses de reserva e a reserva obrigatória (mínimo de 1%).');return;}
    S.cfg.pisoPct=piso;S.cfg.mesesReserva=Math.round(mr);S.cfg.pagueSePct=ps;
    S.cfg.valorHora=vh>0?vh:null;S.cfg.variavelMensal=isNaN(vm)?null:vm;
    S.cfg.meusNomes=val(f,'cfg-nomes').split(',').map(x=>normT(x).trim()).filter(x=>x.length>=5);
    S.bancos=val(f,'cfg-bancos').split(',').map(x=>x.trim()).filter(Boolean);
    persist();render(['cfg-piso','cfg-mr','cfg-ps','cfg-vh','cfg-vm','cfg-bancos','cfg-nomes']);toast('Parâmetros salvos.');return;
  }
  if(name.indexOf('cad-')===0){
    const sec=name.slice(4),def=SEC[sec],o={};
    for(const fd of def.fields){
      const raw=val(f,'f-'+sec+'-'+fd.k);
      if(fd.t==='text'||fd.t==='select'||fd.t==='banco'||fd.t==='date'){if(fd.req&&!raw.trim()){toast('Preencha: '+fd.l+'.');return;}if(fd.t==='date'&&raw&&!/^\d{4}-\d{2}-\d{2}$/.test(raw)){toast(fd.l+': informe uma data válida.');return;}o[fd.k]=raw.trim();}
      else if(fd.t==='int'){
        if(raw.trim()===''){if(fd.req){toast('Preencha: '+fd.l+'.');return;}o[fd.k]=null;}
        else{const n=Math.round(num(raw)),mx=fd.max||31;if(!(n>=1&&n<=mx)){toast(fd.k==='vezes'?(fd.l+' precisa ser um número de 1 a '+mx+'.'):(fd.l+' precisa ser um dia de 1 a 31.'));return;}o[fd.k]=n;}
      }else{
        if(raw.trim()===''){if(fd.req){toast('Preencha: '+fd.l+'.');return;}o[fd.k]=null;}
        else{const n=num(raw);if(isNaN(n)||n<0){toast(fd.l+': informe um número válido.');return;}o[fd.k]=n;}
      }
    }
    if(sec==='rendas'){o.min=o.base;o.max=o.base;}
    const erro=def.check&&def.check(o);if(erro){toast(erro);return;}
    if(ui.editing&&ui.editing.sec===sec){
      const x=S[sec].find(z=>z.id===ui.editing.id);
      if(x){if(sec==='dividas'&&(o.saldo!==x.saldo||o.vezes!==x.vezes))o.ts=Date.now();Object.assign(x,o);}
      ui.editing=null;
    }else{
      const novo=Object.assign({id:uid()},o);
      if(sec==='dividas')novo.ts=Date.now();
      if(sec==='rendas')novo.ativa=true;
      S[sec].push(novo);ui.pre=null;
    }
    ui.lf.kind='lanc';persist();render(['f-'+sec]);toast('Salvo.');
  }
}

/* ---------- 3 meses, plano: compra, metas, dicas ---------- */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function veredito(r,M){
  if(r.nivel==='nao')return {cls:'crit',tag:'Não compre',txt:`O saldo fica negativo em ${fLong(addDays(M.t,r.a1.negIdx))}.`};
  if(r.nivel==='espere'){
    if(r.a0.startBelow)return {cls:'warn',tag:'Espere',txt:`Você já está abaixo do piso. Esse gasto aprofunda o buraco: o menor saldo vai de ${brl0(r.a0.minV)} para ${brl0(r.a1.minV)}.`};
    return {cls:'warn',tag:'Espere',txt:`O saldo cai abaixo do piso em ${fLong(addDays(M.t,r.a1.belowIdx))}${r.a0.belowIdx>=0?` (sem a compra seria em ${fLong(addDays(M.t,r.a0.belowIdx))})`:' (sem a compra o piso se mantém)'}.`};
  }
  if(r.nivel==='atencao')return {cls:'warn',tag:'Cabe, mas custa',txt:`O orçamento aguenta, mas há ${M.alvoDivida?esc(M.alvoDivida.nome):'dívida cara'} em aberto.${r.taxa?` Esse dinheiro, usado na dívida, evitaria ${brl0(r.jurosMes)} de juros por mês.`:''}`};
  return {cls:'good',tag:'Cabe no orçamento',txt:`O menor saldo previsto continua em ${brl0(r.a1.minV)}, acima do piso de ${brl0(M.piso)}.`};
}
const noteCls=c=>c==='good'?'good':(c==='crit'?'crit':'');
function conselhoCompra(M,valor){
  const B=M.B.base,res=M.reserva||0,inv=investAtual(S,lanc),tot=res+inv,alvo=valor*10;
  const pct=tot>0?Math.round(valor/tot*100):null;
  const aporte=B.renda>0?Math.max(0,B.sobra>=B.reserva?B.reserva+(M.dividaCara>0?0:Math.max(0,B.livre)):B.sobra):0;
  const r=checarCompra(S,lanc,M,valor),v=veredito(r,M);
  const guardado=`${brl0(res)} na reserva${inv>0?' e '+brl0(inv)+' investidos':''}`;
  if(tot>=alvo){
    if(v.cls==='good')return {cls:'good',tag:'Pode comprar',txt:`${brl0(valor)} é ${pct}% do que você tem guardado (${guardado}) e o saldo da conta continua acima do piso. Se usar a reserva, devolva esse valor nos meses seguintes, além do aporte regular.`};
    return {cls:'warn',tag:'Só com a reserva',txt:`A reserva comporta: ${brl0(valor)} é ${pct}% do que você tem guardado (${guardado}). A conta não: ${v.txt} Se comprar, tire da reserva e devolva o valor nos meses seguintes, além do aporte regular.`};
  }
  if(!(aporte>0)){
    return {cls:'crit',tag:'Monte a reserva primeiro',txt:tot>0?`${brl0(valor)} seria ${pct}% de tudo o que você tem guardado (${guardado}). Para ser seguro, a compra deve ser no máximo 10% da reserva, ou seja, você precisa de ${brl0(alvo)} guardados. Hoje o mês não sobra para guardar, então não há data segura: primeiro feche a conta do mês.`:`Você ainda não tem reserva de emergência, e ela vem antes de qualquer compra. Esse valor fica seguro quando você tiver ${brl0(alvo)} guardados. Hoje o mês não sobra para guardar, então primeiro feche a conta do mês.`};
  }
  const m=Math.ceil((alvo-tot)/aporte);
  const quando=new Date(M.t.getFullYear(),M.t.getMonth()+m,1,12);
  const qm=MESES[quando.getMonth()]+' de '+quando.getFullYear();
  if(m>36)return {cls:'crit',tag:'Espere',txt:`No ritmo atual, guardando cerca de ${brl0(aporte)} por mês, você leva mais de 3 anos para ter ${brl0(alvo)}, que é o mínimo para essa compra ser só 10% da reserva. Repense a compra ou aumente o aporte.`};
  return {cls:'warn',tag:'Espere até '+qm,txt:`Para esse valor, será seguro comprar em ${qm}. Guardando cerca de ${brl0(aporte)} por mês, a reserva chega a ${brl0(tot+aporte*m)}, e a compra passa a ser só ${Math.round(valor/(tot+aporte*m)*100)}% dela, sem te impactar. ${tot>0?`Hoje ela seria ${pct}% do que você tem guardado (${guardado}). `:'Hoje você não tem reserva. '}Depois de comprar, devolva esse valor à reserva nos meses seguintes, além do aporte regular.`};
}
function vCompra(M){
  const c=ui.compra;let res='';
  if(c){const v=conselhoCompra(M,c.valor);
    res=`<div class="note ${noteCls(v.cls)}" style="margin-top:12px"><b>${v.tag}${c.nome?' ('+esc(c.nome)+', '+brl0(c.valor)+')':' ('+brl0(c.valor)+')'}.</b> ${v.txt}</div>`;}
  return `<section class="card"><h3>Posso gastar isso agora?</h3><p class="small muted" style="margin-top:6px">Leva em conta a sua reserva, os investimentos e o saldo da conta. A regra: a compra só é segura quando for até 10% do que você tem guardado. Nada é lançado.</p>

const metaFeito=m=>sum(lanc.filter(l=>l.categoria==='meta'&&l.refId===m.id&&jaAconteceu(l)),'valor');
/* metas: a reserva de emergência vem primeiro; depois dela, tudo o que sobra no mês vai para as metas, na ordem da data desejada */
function planoMetas(M){
  const B=M.B.base,aporte=B.renda>0?Math.max(0,B.sobra):0;
  const alvoR=M.fase3||0,res=reservaAtual(S,lanc);
  const faltaR=Math.max(0,alvoR-res),mesesR=aporte>0?Math.ceil(faltaR/aporte):Infinity;
  let sobraAtual=Math.max(0,res-alvoR);
  const ord=(S.metas||[]).map((m,ix)=>({m,ix})).sort((x,y)=>((x.m.data||'9999')+String(x.ix).padStart(4,'0')).localeCompare((y.m.data||'9999')+String(y.ix).padStart(4,'0')));
  let acum=0;const out={};
  ord.forEach(({m})=>{
    let rest=Math.max(0,m.valor-metaFeito(m));
    const usa=Math.min(sobraAtual,rest);sobraAtual-=usa;rest-=usa;
    acum+=rest;
    out[m.id]={rest,aporte,alvoR,faltaR,mesesR,meses:rest<1?0:(aporte>0?mesesR+Math.ceil(acum/aporte):Infinity),antes:acum-rest};
  });
  return out;
}
function vereditoMeta(M,m){
  const feito=metaFeito(m);
  const p=(planoMetas(M))[m.id];
  if(!p||p.rest<1)return {cls:'good',tag:'Compre',txt:feito>=m.valor?`Você já juntou ${brl0(feito)}, o valor da meta. Pode comprar sem mexer na reserva de emergência.`:'A reserva já passou do necessário e o excedente cobre esta meta. Pode comprar.'};
  const ja=feito>0?`Já guardou ${brl0(feito)}, faltam ${brl0(p.rest)}. `:'';
  if(!isFinite(p.meses))return {cls:'crit',tag:'Sem previsão',txt:`${ja}Hoje o mês não sobra dinheiro para guardar, então não há como prever. Primeiro feche a conta do mês.`};
  const q=new Date(M.t.getFullYear(),M.t.getMonth()+p.meses,1,12),qm=MESES[q.getMonth()]+' de '+q.getFullYear();
  const partes=[];
  if(p.mesesR>0)partes.push(`primeiro a reserva de emergência (faltam ${brl0(p.faltaR)} de ${brl0(p.alvoR)}, ${p.mesesR} ${p.mesesR===1?'mês':'meses'})`);
  if(p.antes>0)partes.push(`depois as metas com data anterior (${brl0(p.antes)})`);
  partes.push(`${partes.length?'então ':''}esta meta (${brl0(p.rest)})`);
  const atraso=m.data&&iso(q)>m.data?` Fica depois da data que você quer (${fISO(m.data)}).`:'';
  return {prev:qm,cls:atraso?'crit':'warn',tag:'Em '+p.meses+(p.meses===1?' mês':' meses'),txt:`${ja}Guardando cerca de ${brl0(p.aporte)} por mês: ${partes.join(', ')}. ${p.meses===1?'É 1 mês':'São '+p.meses+' meses'} no total, previsão em ${qm}.${atraso} Lance o que guardar como “Guardar para a meta”.`};
}

      <div class="row"><button class="btn small primary" type="submit">Salvar</button>${arm?`<button class="btn small danger" type="button" data-act="meta-del" data-id="${esc(m.id)}">Confirmar exclusão</button>`:`<button class="btn small ghost" type="button" data-act="meta-del-arm" data-id="${esc(m.id)}">Excluir</button>`}<button class="btn small ghost" type="button" data-act="meta-cancel">Cancelar</button></div>${arm&&feito>0?`<p class="small muted">Os ${brl0(feito)} já guardados continuam lançados.</p>`:''}</form>`:'';

function dicas(M){
  const out=[],k=M.scn,a=M.A[k],al=M.alvoDivida;

  }
  const ix=a.belowIdx>=0?a.belowIdx:(a.negIdx>=0?a.negIdx:-1);
  if(ix>=0){
    const cand=M.P.events.filter(e=>!e.virtual&&e.kind!=='reserva'&&e.i<=ix&&e.i>=ix-10&&e.v[k]<0).sort((x,y)=>x.v[k]-y.v[k])[0];
    if(cand){

  const esp=(S.metas||[]).filter(m=>vereditoMeta(M,m).cls!=='good');
  if(esp.length)out.push({cls:'',txt:`${esp.length===1?'Uma meta ainda não pode ser comprada':'Metas ainda não podem ser compradas'}: ${esp.map(m=>esc(m.nome)).join(', ')}. Lance o que for guardando como “Guardar para a meta”.`});
  return out;
}

const kc=v=>{const a=Math.abs(v);return (v<0?'−':'')+(a>=1000?(a/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'k':String(Math.round(a)));};
function statusLinha(M){

  if(a.startBelow)txt=a.recIdx>=0?`Hoje o saldo está abaixo do piso. Volta ao piso em ${fLong(addDays(M.t,a.recIdx))}.`:'Hoje o saldo está abaixo do piso e não volta nos próximos 3 meses.';
